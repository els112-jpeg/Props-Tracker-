<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Props Tracker — 23-Leg Combo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050c;--cy:#00f0ff;--mg:#ff2bd6;--or:#ff8a00;--lm:#b6ff00;--rd:#ff2d55;--tx:#e9fbff;--mut:#6f9bb0;--pn:rgba(4,16,30,.78);--ln:rgba(0,240,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Rajdhani,-apple-system,"Segoe UI",sans-serif;font-weight:600}
body{padding:12px 12px 70px;max-width:660px;margin:0 auto;position:relative;min-height:100vh}
/* TRON FLOOR + SKY */
.sky{position:fixed;inset:0;z-index:-3;background:radial-gradient(120% 60% at 50% 0%,#0a2a4a 0%,#041223 45%,#02050c 100%)}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:62vh;z-index:-2;transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
 background-image:linear-gradient(var(--cy) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--cy) 1.5px,transparent 1.5px);background-size:56px 56px;opacity:.42;
 -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:0 56px}}
.horizon{position:fixed;left:0;right:0;bottom:38vh;height:2px;z-index:-2;background:linear-gradient(90deg,transparent,var(--cy),var(--mg),transparent);box-shadow:0 0 30px 6px rgba(0,240,255,.5);opacity:.7}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@media (prefers-reduced-motion:reduce){.floor,.live,.leg.danger,.big{animation:none!important}}
/* HUD */
.top{position:relative;padding:14px;background:var(--pn);backdrop-filter:blur(10px);border:1px solid var(--cy);
 clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
 box-shadow:0 0 0 1px rgba(0,240,255,.15) inset,0 0 26px rgba(0,240,255,.35),0 12px 40px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:900 15px Orbitron,sans-serif;margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 12px var(--cy)}
h1 em{font-style:normal;color:var(--mg);text-shadow:0 0 12px var(--mg)}
.clock{font:700 12px Orbitron,monospace;color:var(--or);text-shadow:0 0 8px rgba(255,138,0,.8)}
.tick{margin-top:10px;display:flex;align-items:baseline;justify-content:space-between}
.tick .big{font:900 22px Orbitron,sans-serif;letter-spacing:.06em;animation:pulse 2s ease-in-out infinite}
.alive{color:var(--cy);text-shadow:0 0 16px var(--cy)}.dead{color:var(--rd);text-shadow:0 0 16px var(--rd)}.cashed{color:var(--lm);text-shadow:0 0 18px var(--lm)}
@keyframes pulse{50%{filter:brightness(1.5)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.stat{padding:7px 2px;text-align:center;background:rgba(0,240,255,.06);border:1px solid var(--ln);border-radius:4px;box-shadow:inset 0 -10px 18px rgba(0,240,255,.07)}
.stat b{display:block;font:900 20px Orbitron,sans-serif}.stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em}
.meta{font-size:11px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;align-items:center}
.meta b{color:var(--tx)}
.filters{display:flex;gap:7px;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--ln);background:rgba(4,16,30,.8);color:var(--mut);padding:7px 13px;font:700 12px Orbitron,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transform:skewX(-12deg);border-radius:2px}
.chip.on{background:var(--cy);color:#001418;border-color:var(--cy);box-shadow:0 0 18px var(--cy)}
/* GAMES */
.game{margin-top:20px}
.gh{padding:12px;background:var(--pn);border:1px solid var(--mg);backdrop-filter:blur(8px);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);box-shadow:0 0 22px rgba(255,43,214,.3),0 10px 30px rgba(0,0,0,.5)}
.gt{display:flex;justify-content:space-between;align-items:center;font:900 14px Orbitron,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 10px var(--mg)}
.badge{font:900 10px Orbitron,sans-serif;letter-spacing:.14em;padding:4px 9px;text-transform:uppercase;border-radius:2px}
.b-pre{background:rgba(0,240,255,.12);color:var(--cy);border:1px solid var(--cy)}
.b-live{background:var(--rd);color:#fff;box-shadow:0 0 18px var(--rd)}.live{animation:pulse 1s ease-in-out infinite}
.b-final{background:#1a2733;color:var(--mut);border:1px solid var(--ln)}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 8px}
.team{text-align:center;font:900 12px Orbitron,sans-serif;color:var(--mut);letter-spacing:.14em}
.team input{display:block;width:76px;margin:4px auto 0;background:rgba(0,0,0,.5);border:1px solid var(--cy);color:var(--tx);font:900 28px Orbitron,sans-serif;text-align:center;padding:4px 0;border-radius:3px;text-shadow:0 0 12px var(--cy);box-shadow:0 0 14px rgba(0,240,255,.25) inset}
.team input:disabled{opacity:1;border-color:var(--lm);text-shadow:0 0 12px var(--lm)}
.sc{margin:4px auto 0;min-width:76px;padding:4px 10px;background:rgba(0,0,0,.5);border:1px solid var(--cy);color:var(--tx);font:900 28px Orbitron,sans-serif;text-align:center;border-radius:3px;text-shadow:0 0 12px var(--lm);border-color:var(--lm);box-shadow:0 0 14px rgba(182,255,0,.2) inset}
.clk{font:700 15px Orbitron,sans-serif;letter-spacing:.12em;color:var(--or);text-shadow:0 0 10px rgba(255,138,0,.7)}
.dash{color:var(--mg);font:900 20px Orbitron,sans-serif;margin-top:18px;text-shadow:0 0 10px var(--mg)}
.ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
select,.ctrl input{background:rgba(0,0,0,.55);border:1px solid var(--ln);color:var(--tx);border-radius:3px;padding:7px 8px;font:700 14px Orbitron,monospace}
.ctrl input{width:84px;text-align:center}
.wp{font-size:12px;color:var(--mut);text-align:center;margin-top:8px;letter-spacing:.06em}
/* LEG CARDS */
.leg{--c:var(--cy);position:relative;margin-top:11px;padding:12px;background:linear-gradient(160deg,rgba(6,24,44,.92),rgba(3,10,20,.92));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
 clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
 box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent) inset,0 0 22px color-mix(in srgb,var(--c) 30%,transparent),0 14px 26px rgba(0,0,0,.55);transform:translateZ(0)}
.leg::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--c);box-shadow:0 0 14px 2px var(--c)}
.leg.alive{--c:var(--cy)}.leg.won{--c:var(--lm)}.leg.lost{--c:var(--rd);filter:saturate(.8)}.leg.danger{--c:var(--or);animation:dng 1.1s ease-in-out infinite}
@keyframes dng{50%{box-shadow:0 0 0 1px rgba(255,138,0,.4) inset,0 0 38px rgba(255,138,0,.75),0 14px 26px rgba(0,0,0,.55)}}
.lh{display:flex;align-items:center;gap:11px}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 17px Orbitron,sans-serif;color:#fff;letter-spacing:.02em;
 background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--rc) 55%,#fff 0%),#04101e 78%);border:2px solid var(--rc);box-shadow:0 0 16px var(--rc),0 0 0 4px rgba(0,0,0,.5),0 0 0 5px color-mix(in srgb,var(--rc) 40%,transparent)}
.ay{--rc:var(--cy)}.an{--rc:var(--mg)}
.who{flex:1;min-width:0}
.nm{font:700 18px Rajdhani,sans-serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{font-size:12px;color:var(--mut);margin-top:2px;letter-spacing:.05em}
.side{font:900 10px Orbitron,sans-serif;padding:2px 6px;margin-right:6px;letter-spacing:.1em;border-radius:2px;vertical-align:1px}
.s-yes{background:var(--cy);color:#001418;box-shadow:0 0 10px var(--cy)}.s-no{background:var(--mg);color:#1a0016;box-shadow:0 0 10px var(--mg)}
.pct{text-align:right;flex:none}.pct b{font:900 24px Orbitron,sans-serif;color:var(--lm);text-shadow:0 0 14px rgba(182,255,0,.7)}
.pct span{display:block;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.bar{height:12px;background:rgba(0,0,0,.6);border:1px solid var(--ln);margin:12px 0 7px;position:relative;overflow:hidden;border-radius:2px}
.bar i{display:block;height:100%;transition:width .3s;box-shadow:0 0 14px 1px currentColor}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(2,5,12,.85) 9px 11px)}
.st{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.st b{color:var(--tx);font-family:Orbitron,sans-serif}
.tag{font:900 11px Orbitron,sans-serif;letter-spacing:.06em}
.t-won{color:var(--lm);text-shadow:0 0 10px var(--lm)}.t-lost{color:var(--rd);text-shadow:0 0 10px var(--rd)}.t-alive{color:var(--cy)}.t-danger{color:var(--or);text-shadow:0 0 10px var(--or)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding-right:6px;margin-top:11px}
.stp{background:rgba(0,0,0,.45);border:1px solid var(--ln);border-radius:4px;padding:6px;text-align:center}
.stp label{font:700 10px Orbitron,sans-serif;color:var(--or);letter-spacing:.16em}
.stp .v{display:flex;align-items:center;justify-content:center;margin-top:3px}
.stp button{width:33px;height:36px;border:1px solid var(--cy);background:rgba(0,240,255,.08);color:var(--cy);font:900 20px Orbitron,sans-serif;border-radius:3px}
.stp button:active{background:var(--cy);color:#001418;box-shadow:0 0 18px var(--cy)}
.stp .n{font:900 26px Orbitron,sans-serif;min-width:24px;text-shadow:0 0 10px rgba(255,255,255,.5)}
.foot{margin-top:24px;display:flex;gap:8px;justify-content:center}
.btn{background:rgba(4,16,30,.8);border:1px solid var(--ln);color:var(--mut);padding:9px 14px;font:700 12px Orbitron,sans-serif;letter-spacing:.08em;border-radius:3px}
.btn.warn{color:var(--rd);border-color:rgba(255,45,85,.5)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="sky"></div><div class="horizon"></div><div class="floor"></div><div class="scan"></div>
<div id="app"></div>
<script>
// ---- DATA (from the Kalshi 23-market combo, 11.19.26) ----
const TIP = Date.parse('2026-11-20T01:00:00Z'); // 7:00 PM CST, all four games
const GAMES = [
 {id:'gsw',away:'GSW',home:'MEM',title:'Warriors @ Grizzlies',wp:'MEM 65.7% · GSW 34.3%',legs:[
  ['Cameron Boozer',25,1,83],['Jaylen Wells',10,1,81]]},
 {id:'lac',away:'LAC',home:'SAS',title:'Clippers @ Spurs',wp:'SAS 89% · LAC 11%',legs:[
  ['Brook Lopez',25,0,78],['Darius Garland',25,1,70],['Derrick Jones Jr.',20,0,80],['Keaton Wagler',20,0,73],
  ['Rui Hachimura',25,0,90],["De'Aaron Fox",30,0,71],['Devin Vassell',25,0,78],['Stephon Castle',25,1,74],['Victor Wembanyama',40,1,64]]},
 {id:'nyk',away:'NYK',home:'MIN',title:'Knicks @ Timberwolves',wp:'NYK 51.1% · MIN 48.9%',legs:[
  ['Jonathan Kuminga',30,0,88],['Jaden McDaniels',30,0,74],['LaMelo Ball',25,1,72],['Rudy Gobert',25,0,75],
  ['Jalen Brunson',30,1,72],['Josh Hart',15,1,69],['Karl-Anthony Towns',35,1,64],['Landry Shamet',20,0,84],
  ['Mikal Bridges',20,0,73],['OG Anunoby',30,0,83]]},
 {id:'por',away:'POR',home:'MIL',title:'Trail Blazers @ Bucks',wp:'POR 82.2% · MIL 17.8%',legs:[
  ['Damian Lillard',35,0,62],['Sidy Cissoko',10,1,78]]}
];
const LEGS = [];
GAMES.forEach(g=>g.legs.forEach((l,i)=>LEGS.push({id:g.id+i,g:g.id,name:l[0],thr:l[1],yes:!!l[2],pct:l[3]})));
const ini=n=>n.replace(/[^A-Za-z .'-]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const COST=9.76, PAYOUT=4166.66;

// ---- STATE ----
const KEY='props-tracker-1119';
let S={stats:{},games:{}};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.stats)S=x}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const gs=id=>S.games[id]||(S.games[id]={a:0,h:0,q:1,clk:'12:00',st:'auto'});
const st=id=>S.stats[id]||(S.stats[id]=[0,0,0]);

// ---- LIVE FEED (ESPN public scoreboard + box score, polled every 5s) ----
const BASE='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const ALIAS={GSW:['GS','GSW'],SAS:['SA','SAS'],NYK:['NY','NYK'],MIN:['MIN'],MEM:['MEM'],LAC:['LAC'],MIL:['MIL'],POR:['POR']};
let F={games:{},stats:{},ok:false,err:'',at:0,on:true};
try{F.on=localStorage.getItem(KEY+'-feed')!=='off'}catch(e){}
const norm=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').replace(/\b(jr|sr|ii|iii)\b/g,'').replace(/\s+/g,' ').trim();
const feedG=id=>(F.on&&F.ok&&F.games[id])||null;
const effStats=id=>(F.on&&F.ok&&F.stats[id])||st(id);
const hasFeed=id=>!!(F.on&&F.ok&&F.stats[id]);
const eff=g=>{const o=gs(g.id),f=feedG(g.id);return f?Object.assign({},o,f):o};
async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
let polling=false;
async function poll(){
  if(!F.on||polling)return;polling=true;
  try{
    const sb=await j(BASE+'/scoreboard?dates=20261119&limit=50');
    const ng={},ns={};
    await Promise.all(GAMES.map(async g=>{
      const ev=(sb.events||[]).find(e=>{const cs=(e.competitions?.[0]?.competitors||[]).map(c=>c.team?.abbreviation);return ALIAS[g.away].some(a=>cs.includes(a))&&ALIAS[g.home].some(a=>cs.includes(a))});
      if(!ev)return;
      const cs=ev.competitions[0].competitors;
      const A=cs.find(c=>ALIAS[g.away].includes(c.team.abbreviation)),H=cs.find(c=>ALIAS[g.home].includes(c.team.abbreviation));
      const stt=ev.status?.type?.state||'pre';
      ng[g.id]={a:+A.score||0,h:+H.score||0,q:Math.max(1,ev.status?.period||1),clk:String(ev.status?.displayClock||'12:00'),state:stt==='in'?'live':stt==='post'?'final':'pre',id:ev.id};
      if(stt==='pre')return;
      try{
        const sm=await j(BASE+'/summary?event='+ev.id);
        const rows={};
        for(const t of (sm.boxscore?.players||[])){for(const blk of (t.statistics||[])){
          const L=blk.labels||[],ip=L.indexOf('PTS'),ir=L.indexOf('REB'),ia=L.indexOf('AST');
          if(ip<0||ir<0||ia<0)continue;
          for(const at of (blk.athletes||[])){const s=at.stats||[];rows[norm(at.athlete?.displayName)]=[+s[ip]||0,+s[ir]||0,+s[ia]||0]}
        }}
        for(const l of LEGS.filter(x=>x.g===g.id)){ns[l.id]=rows[norm(l.name)]||[0,0,0]}
      }catch(e){}
    }));
    F.games=ng;F.stats=ns;F.ok=Object.keys(ng).length>0;F.err=F.ok?'':'Games not found on feed yet';F.at=Date.now();
  }catch(e){F.ok=false;F.err=String(e&&e.message||e);F.at=Date.now()}
  polling=false;
  const a=document.activeElement;
  if(!a||!['INPUT','SELECT'].includes(a.tagName))render();else tickTime();
}
// ---- KALSHI LIVE PRICES (public market data, polled every 5s) ----
const KAPI='https://api.elections.kalshi.com/trade-api/v2/markets';
let K={},KS={ok:false,at:0,err:'',n:0};
const kp=l=>K[l.id]||null;
const livePct=l=>{const k=kp(l);return k?k.pct:l.pct};
async function pollKalshi(){
  try{
    const res=await Promise.all(GAMES.map(g=>j(KAPI+'?event_ticker=KXNBAPRA-26NOV19'+g.away+g.home+'&limit=300').then(d=>d.markets||[]).catch(()=>[])));
    const nk={};let n=0;
    GAMES.forEach((g,gi)=>{
      const ms=res[gi];
      LEGS.filter(l=>l.g===g.id).forEach(l=>{
        const m=ms.find(m=>{const sub=String(m.yes_sub_title||'');const nm=sub.split(':')[0];const t=/(\d+)\+/.exec(sub);return norm(nm)===norm(l.name)&&t&&+t[1]===l.thr});
        if(!m)return;
        const f=v=>parseFloat(v)||0;
        let yes;
        if(m.result==='yes'||m.result==='no'){yes=m.result==='yes'?1:0}
        else{const b=f(m.yes_bid_dollars),a=f(m.yes_ask_dollars);yes=a>0?(b+a)/2:f(m.last_price_dollars)}
        const p=Math.round((l.yes?yes:1-yes)*100);
        nk[l.id]={pct:p,bid:f(l.yes?m.yes_bid_dollars:m.no_bid_dollars),ask:f(l.yes?m.yes_ask_dollars:m.no_ask_dollars),settled:!!m.result};
        n++;
      });
    });
    K=nk;KS={ok:n>0,at:Date.now(),err:n>0?'':'No matching Kalshi markets',n};
  }catch(e){KS={ok:false,at:Date.now(),err:String(e&&e.message||e),n:0}}
  const a=document.activeElement;
  if(!a||!['INPUT','SELECT'].includes(a.tagName))render();else tickTime();
}
function gameState(g){
  const f=feedG(g.id);if(f)return f.state;
  const s=gs(g.id).st;
  if(s==='final')return 'final';
  if(s==='live')return 'live';
  return Date.now()>=TIP?'live':'pre';
}
function elapsed(g){
  const o=eff(g);const m=/^(\d{1,2}):(\d{2})/.exec(o.clk||'');
  const rem=m?(+m[1]+ +m[2]/60):(/^\d+(\.\d+)?$/.test(o.clk||'')?parseFloat(o.clk)/60:12);
  if(o.q<=4)return (o.q-1)*12+(12-Math.min(12,rem));
  return 48+(o.q-5)*5+(5-Math.min(5,rem));
}
function legInfo(l){
  const g=GAMES.find(x=>x.id===l.g);const gst=gameState(g);
  const [p,r,a]=effStats(l.id);const pra=p+r+a;const need=l.thr-pra;
  let res;
  if(l.yes){res=pra>=l.thr?'won':(gst==='final'?'lost':'alive')}
  else{res=pra>=l.thr?'lost':(gst==='final'?'won':'alive')}
  let danger=!l.yes&&res==='alive'&&need<=5&&gst!=='pre';
  const el=elapsed(g);
  const proj=(gst==='live'&&el>=3)?pra/el*48:null;
  return {pra,need,res,danger,proj,gst};
}

// ---- RENDER ----
let filter='all',LAST='';
const $=s=>document.getElementById(s);
function fmtTime(ms){
  if(ms<=0)return null;const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+'h ':'')+m+'m '+String(x).padStart(2,'0')+'s';
}
function render(){
  const infos=LEGS.map(l=>({l,i:legInfo(l)}));
  const won=infos.filter(x=>x.i.res==='won').length,lost=infos.filter(x=>x.i.res==='lost').length;
  const alive=infos.length-won-lost;
  const prob=LEGS.reduce((a,l)=>a*(livePct(l)/100),1);
  const tk=lost>0?['TICKET DEAD','dead']:(won===LEGS.length?['TICKET CASHED','cashed']:['TICKET ALIVE','alive']);
  let h=`<div class="top"><div class="row"><h1>Prop <em>Grid</em> · 23-Leg</h1><div class="clock" id="now"></div></div>
  <div class="tick"><div class="big ${tk[1]}">${tk[0]}</div><div style="text-align:right;font-size:12px;color:var(--mut)">$${COST.toFixed(2)} → <b style="color:var(--tx)">$${PAYOUT.toLocaleString()}</b></div></div>
  <div class="stats"><div class="stat"><b>${LEGS.length}</b><span>Legs</span></div><div class="stat"><b style="color:var(--lm)">${won}</b><span>Hit</span></div><div class="stat"><b style="color:var(--cy)">${alive}</b><span>Alive</span></div><div class="stat"><b style="color:var(--rd)">${lost}</b><span>Busted</span></div></div>
  <div class="meta"><span>Combined leg odds (product): <b style="color:var(--tx)">${(prob*100).toFixed(3)}%</b></span><span id="cd"></span></div>
  <div class="meta"><span id="kfeed"></span></div>
  <div class="meta"><span id="feed"></span></div></div>
  <div class="filters">${[['all','All'],['alive','Alive'],['danger','Danger'],['won','Hit'],['lost','Busted'],['yes','YES legs'],['no','NO legs']].map(f=>`<button class="chip ${filter===f[0]?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>`;
  GAMES.forEach(g=>{
    const o=eff(g),gst=gameState(g),fd=!!feedG(g.id);
    const bc=gst==='pre'?'b-pre':gst==='live'?'b-live':'b-final';
    const bl=gst==='pre'?'Pregame · 7:00 PM CT':gst==='live'?(fd?'Live · auto':'Live'):'Final';
    h+=`<div class="game"><div class="gh"><div class="gt"><span>${g.title}</span><span class="badge ${bc} ${gst==='live'?'live':''}">${bl}</span></div>
    <div class="score"><div class="team">${g.away}<div class="sc">${o.a}</div></div><div class="dash">–</div><div class="team">${g.home}<div class="sc">${o.h}</div></div></div>
    <div class="ctrl"><span class="clk">${gst==='pre'?'TIP-OFF 7:00 PM CT':gst==='final'?'FINAL':(o.q<5?'Q'+o.q:'OT'+(o.q>5?o.q-4:''))+' · '+o.clk}</span></div>
    <div class="wp">Pregame win prob: ${g.wp}</div></div>`;
    infos.filter(x=>x.l.g===g.id).forEach(({l,i})=>{
      const cls=i.danger&&i.res==='alive'?'danger':i.res;
      const show=filter==='all'||(filter==='alive'&&i.res==='alive')||(filter==='danger'&&i.danger)||(filter==='won'&&i.res==='won')||(filter==='lost'&&i.res==='lost')||(filter==='yes'&&l.yes)||(filter==='no'&&!l.yes);
      if(!show)return;
      const fill=Math.min(100,i.pra/l.thr*100);
      let col=l.yes?'var(--lm)':(fill>=100?'var(--rd)':fill>=75?'var(--or)':'var(--cy)');
      let tag,sub;
      if(i.res==='won'){tag=['WON','t-won'];sub=l.yes?`Cleared by ${i.pra-l.thr}`:`Stayed under`}
      else if(i.res==='lost'){tag=['BUSTED','t-lost'];sub=l.yes?'Finished short':`Went over by ${i.pra-l.thr}`}
      else if(l.yes){tag=['NEEDS '+i.need,'t-alive'];sub=i.proj!=null?`Pace ${i.proj.toFixed(1)}`:'—'}
      else{tag=[i.danger?'DANGER · '+i.need+' LEFT':'CUSHION '+i.need,i.danger?'t-danger':'t-alive'];sub=i.proj!=null?`Pace ${i.proj.toFixed(1)}`:'—'}
      const v=effStats(l.id),fed=hasFeed(l.id);
      h+=`<div class="leg ${cls}"><div class="lh"><div class="av ${l.yes?'ay':'an'}">${ini(l.name)}</div><div class="who"><div class="nm">${l.name}</div><div class="ln"><span class="side ${l.yes?'s-yes':'s-no'}">${l.yes?'YES':'NO'}</span>${l.thr}+ PTS·REB·AST</div></div>
      <div class="pct"><b>${livePct(l)}%</b><span>${kp(l)?`Kalshi live · ${(livePct(l)-l.pct)>0?'▲':(livePct(l)-l.pct)<0?'▼':'='}${Math.abs(livePct(l)-l.pct)} vs ${l.pct}%`:`Kalshi at entry`}</span></div></div>
      <div class="bar"><i style="width:${fill}%;background:${col};color:${col}"></i></div>
      <div class="st"><span><b>${i.pra}</b> / ${l.thr} PRA (${fill.toFixed(0)}%)</span><span class="tag ${tag[1]}">${tag[0]}</span><span>${sub}</span></div>
      <div class="steps">${['PTS','REB','AST'].map((n,k)=>`<div class="stp"><label>${n}</label><div class="v"><span class="n">${v[k]}</span></div></div>`).join('')}</div></div>`;
    });
  });
  h+=`<div class="foot"><button class="btn warn" id="reset">Reset all stats</button></div>
  <div class="note">Scores, clock and player stats update automatically every second from the live feed.<br>Percentages: live Kalshi price for your side of each leg (YES or NO), refreshed every 5s, compared with your entry % · bar = progress to the line. NO legs bust when the player reaches the line. All 23 legs must hit.</div>`;
  if(h!==LAST){LAST=h;$('app').innerHTML=h}
  tickTime();
}
function tickTime(){
  const n=$('now');if(!n)return;
  const d=new Date();
  n.textContent=d.toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit'})+' CT';
  const fe=$('feed');if(fe){
    if(!F.on)fe.innerHTML='Manual mode';
    else if(F.ok)fe.innerHTML='<span style="color:var(--lm)">●</span> Live feed · updated '+Math.max(0,Math.round((Date.now()-F.at)/1000))+'s ago · every 1s';
    else if(!F.at)fe.textContent='Connecting to live feed…';
    else fe.innerHTML='<span style="color:var(--or)">●</span> Stats feed unavailable ('+F.err+') · retrying every 1s';
  }
  const ke=$('kfeed');if(ke){
    if(KS.ok)ke.innerHTML='<span style="color:var(--lm)">●</span> Kalshi prices live · '+KS.n+'/'+LEGS.length+' legs matched · '+Math.max(0,Math.round((Date.now()-KS.at)/1000))+'s ago';
    else if(!KS.at)ke.textContent='Connecting to Kalshi…';
    else ke.innerHTML='<span style="color:var(--or)">●</span> Kalshi unavailable ('+KS.err+') · showing entry %';
  }
  const c=$('cd');if(c){const t=fmtTime(TIP-Date.now());c.textContent=t?'Tip-off in '+t:'Games underway'}
}
let wasLive=Date.now()>=TIP;
setInterval(()=>{tickTime();const nl=Date.now()>=TIP;if(nl!==wasLive){wasLive=nl;render()}},1000);

// ---- EVENTS ----
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='feedtog'){F.on=!F.on;try{localStorage.setItem(KEY+'-feed',F.on?'on':'off')}catch(e){}render();if(F.on)poll();return}
  if(b.dataset.f){filter=b.dataset.f;render();return}
  if(b.dataset.l){const v=st(b.dataset.l);const k=+b.dataset.k;v[k]=Math.max(0,v[k]+ +b.dataset.d);save();render();return}
  if(b.id==='reset'){
    if(b.dataset.armed){S={stats:{},games:{}};save();render()}
    else{b.dataset.armed=1;b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset all stats'}},3000)}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.g)return;
  const o=gs(t.dataset.g),k=t.dataset.k;
  if(k==='a'||k==='h')o[k]=Math.max(0,parseInt(t.value)||0);
  else if(k==='q')o.q=+t.value;
  else if(k==='clk'){let v=t.value.trim();if(/^\d{1,2}$/.test(v))v+=':00';o.clk=/^\d{1,2}:\d{2}$/.test(v)?v:'12:00'}
  else if(k==='st')o.st=t.value;
  save();render();
});
render();
poll();pollKalshi();setInterval(poll,1000);setInterval(pollKalshi,5000);
</script>
</body>
</html>
