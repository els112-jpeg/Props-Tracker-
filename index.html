<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Props Tracker — 23-Leg Combo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050c;--cy:#00f0ff;--mg:#ff2bd6;--or:#ff8a00;--lm:#b6ff00;--rd:#ff2d55;--tx:#e9fbff;--mut:#6f9bb0;--pn:rgba(4,16,30,.78);--ln:rgba(0,240,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font-family:Rajdhani,-apple-system,"Segoe UI",sans-serif;font-weight:600}
body{padding:12px 12px 70px;max-width:660px;margin:0 auto;position:relative;min-height:100vh}
/* TRON FLOOR + SKY */
.sky{position:fixed;inset:0;z-index:-3;background:radial-gradient(120% 60% at 50% 0%,#0a2a4a 0%,#041223 45%,#02050c 100%)}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:62vh;z-index:-2;transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
 background-image:linear-gradient(var(--cy) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--cy) 1.5px,transparent 1.5px);background-size:56px 56px;opacity:.42;
 -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:0 56px}}
.horizon{position:fixed;left:0;right:0;bottom:38vh;height:2px;z-index:-2;background:linear-gradient(90deg,transparent,var(--cy),var(--mg),transparent);box-shadow:0 0 30px 6px rgba(0,240,255,.5);opacity:.7}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@media (prefers-reduced-motion:reduce){.floor,.live,.leg.danger,.big{animation:none!important}}
/* FLOATING TEAM TAGS (text only, no logos) */
.teams{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.tm{position:absolute;font:900 clamp(54px,17vw,110px) Orbitron,sans-serif;letter-spacing:.06em;color:transparent;-webkit-text-stroke:2px var(--tc);opacity:.5;text-shadow:0 0 28px var(--tc);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-14px,-18px,0) rotate(-6deg)}to{transform:translate3d(16px,22px,0) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.tm{animation:none}}
/* LOGIN + TICKET ROWS */
.fld{display:block;width:100%;margin-top:10px;padding:12px;background:rgba(0,0,0,.55);border:1px solid var(--cy);color:var(--tx);font:600 16px Rajdhani,sans-serif;border-radius:3px;box-shadow:0 0 14px rgba(0,240,255,.2) inset}
.tk{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 10px;border:1px solid var(--ln);background:rgba(0,240,255,.05);font-size:13px;color:var(--mut)}
.tk b{display:block;color:var(--tx);font:900 12px Orbitron,sans-serif;letter-spacing:.08em}.tk span{display:block}
/* HUD */
.top{position:relative;padding:14px;background:var(--pn);backdrop-filter:blur(10px);border:1px solid var(--cy);
 clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
 box-shadow:0 0 0 1px rgba(0,240,255,.15) inset,0 0 26px rgba(0,240,255,.35),0 12px 40px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:900 15px Orbitron,sans-serif;margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 12px var(--cy)}
h1 em{font-style:normal;color:var(--mg);text-shadow:0 0 12px var(--mg)}
.clock{font:700 12px Orbitron,monospace;color:var(--or);text-shadow:0 0 8px rgba(255,138,0,.8)}
.tick{margin-top:10px;display:flex;align-items:baseline;justify-content:space-between}
.tick .big{font:900 22px Orbitron,sans-serif;letter-spacing:.06em;animation:pulse 2s ease-in-out infinite}
.alive{color:var(--cy);text-shadow:0 0 16px var(--cy)}.dead{color:var(--rd);text-shadow:0 0 16px var(--rd)}.cashed{color:var(--lm);text-shadow:0 0 18px var(--lm)}
@keyframes pulse{50%{filter:brightness(1.5)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.stat{padding:7px 2px;text-align:center;background:rgba(0,240,255,.06);border:1px solid var(--ln);border-radius:4px;box-shadow:inset 0 -10px 18px rgba(0,240,255,.07)}
.stat b{display:block;font:900 20px Orbitron,sans-serif}.stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em}
.meta{font-size:11px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;align-items:center}
.meta b{color:var(--tx)}
.filters{display:flex;gap:7px;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--ln);background:rgba(4,16,30,.8);color:var(--mut);padding:7px 13px;font:700 12px Orbitron,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transform:skewX(-12deg);border-radius:2px}
.chip.on{background:var(--cy);color:#001418;border-color:var(--cy);box-shadow:0 0 18px var(--cy)}
/* GAMES */
.game{margin-top:20px}
.gh{padding:12px;background:var(--pn);border:1px solid var(--mg);backdrop-filter:blur(8px);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);box-shadow:0 0 22px rgba(255,43,214,.3),0 10px 30px rgba(0,0,0,.5)}
.gt{display:flex;justify-content:space-between;align-items:center;font:900 14px Orbitron,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 10px var(--mg)}
.badge{font:900 10px Orbitron,sans-serif;letter-spacing:.14em;padding:4px 9px;text-transform:uppercase;border-radius:2px}
.b-pre{background:rgba(0,240,255,.12);color:var(--cy);border:1px solid var(--cy)}
.b-live{background:var(--rd);color:#fff;box-shadow:0 0 18px var(--rd)}.live{animation:pulse 1s ease-in-out infinite}
.b-final{background:#1a2733;color:var(--mut);border:1px solid var(--ln)}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 8px}
.team{text-align:center;font:900 12px Orbitron,sans-serif;color:var(--mut);letter-spacing:.14em}
.team input{display:block;width:76px;margin:4px auto 0;background:rgba(0,0,0,.5);border:1px solid var(--cy);color:var(--tx);font:900 28px Orbitron,sans-serif;text-align:center;padding:4px 0;border-radius:3px;text-shadow:0 0 12px var(--cy);box-shadow:0 0 14px rgba(0,240,255,.25) inset}
.team input:disabled{opacity:1;border-color:var(--lm);text-shadow:0 0 12px var(--lm)}
.sc{margin:4px auto 0;min-width:76px;padding:4px 10px;background:rgba(0,0,0,.5);border:1px solid var(--cy);color:var(--tx);font:900 28px Orbitron,sans-serif;text-align:center;border-radius:3px;text-shadow:0 0 12px var(--lm);border-color:var(--lm);box-shadow:0 0 14px rgba(182,255,0,.2) inset}
.clk{font:700 15px Orbitron,sans-serif;letter-spacing:.12em;color:var(--or);text-shadow:0 0 10px rgba(255,138,0,.7)}
.dash{color:var(--mg);font:900 20px Orbitron,sans-serif;margin-top:18px;text-shadow:0 0 10px var(--mg)}
.ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
select,.ctrl input{background:rgba(0,0,0,.55);border:1px solid var(--ln);color:var(--tx);border-radius:3px;padding:7px 8px;font:700 14px Orbitron,monospace}
.ctrl input{width:84px;text-align:center}
.wp{font-size:12px;color:var(--mut);text-align:center;margin-top:8px;letter-spacing:.06em}
/* LEG CARDS */
.leg{--c:var(--cy);position:relative;margin-top:11px;padding:12px;background:linear-gradient(160deg,rgba(6,24,44,.66),rgba(3,10,20,.7));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
 clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
 box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent) inset,0 0 22px color-mix(in srgb,var(--c) 30%,transparent),0 14px 26px rgba(0,0,0,.55);transform:translateZ(0)}
.leg::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--c);box-shadow:0 0 14px 2px var(--c)}
.leg.alive{--c:var(--cy)}.leg.won{--c:var(--lm)}.leg.lost{--c:var(--rd);filter:saturate(.8)}.leg.danger{--c:var(--or);animation:dng 1.1s ease-in-out infinite}
@keyframes dng{50%{box-shadow:0 0 0 1px rgba(255,138,0,.4) inset,0 0 38px rgba(255,138,0,.75),0 14px 26px rgba(0,0,0,.55)}}
.lh{display:flex;align-items:center;gap:11px}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 17px Orbitron,sans-serif;color:#fff;letter-spacing:.02em;
 background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--rc) 55%,#fff 0%),#04101e 78%);border:2px solid var(--rc);box-shadow:0 0 16px var(--rc),0 0 0 4px rgba(0,0,0,.5),0 0 0 5px color-mix(in srgb,var(--rc) 40%,transparent)}
.ay{--rc:var(--cy)}.an{--rc:var(--mg)}
.who{flex:1;min-width:0}
.nm{font:700 18px Rajdhani,sans-serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{font-size:12px;color:var(--mut);margin-top:2px;letter-spacing:.05em}
.side{font:900 10px Orbitron,sans-serif;padding:2px 6px;margin-right:6px;letter-spacing:.1em;border-radius:2px;vertical-align:1px}
.s-yes{background:var(--cy);color:#001418;box-shadow:0 0 10px var(--cy)}.s-no{background:var(--mg);color:#1a0016;box-shadow:0 0 10px var(--mg)}
.pct{text-align:right;flex:none}.pct b{font:900 24px Orbitron,sans-serif;color:var(--lm);text-shadow:0 0 14px rgba(182,255,0,.7)}
.pct span{display:block;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.bar{height:12px;background:rgba(0,0,0,.6);border:1px solid var(--ln);margin:12px 0 7px;position:relative;overflow:hidden;border-radius:2px}
.bar i{display:block;height:100%;transition:width .3s;box-shadow:0 0 14px 1px currentColor}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(2,5,12,.85) 9px 11px)}
.st{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.st b{color:var(--tx);font-family:Orbitron,sans-serif}
.tag{font:900 11px Orbitron,sans-serif;letter-spacing:.06em}
.t-won{color:var(--lm);text-shadow:0 0 10px var(--lm)}.t-lost{color:var(--rd);text-shadow:0 0 10px var(--rd)}.t-alive{color:var(--cy)}.t-danger{color:var(--or);text-shadow:0 0 10px var(--or)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding-right:6px;margin-top:11px}
.stp{background:rgba(0,0,0,.45);border:1px solid var(--ln);border-radius:4px;padding:6px;text-align:center}
.stp label{font:700 10px Orbitron,sans-serif;color:var(--or);letter-spacing:.16em}
.stp .v{display:flex;align-items:center;justify-content:center;margin-top:3px}
.stp button{width:33px;height:36px;border:1px solid var(--cy);background:rgba(0,240,255,.08);color:var(--cy);font:900 20px Orbitron,sans-serif;border-radius:3px}
.stp button:active{background:var(--cy);color:#001418;box-shadow:0 0 18px var(--cy)}
.stp .n{font:900 26px Orbitron,sans-serif;min-width:24px;text-shadow:0 0 10px rgba(255,255,255,.5)}
.foot{margin-top:24px;display:flex;gap:8px;justify-content:center}
.btn{background:rgba(4,16,30,.8);border:1px solid var(--ln);color:var(--mut);padding:9px 14px;font:700 12px Orbitron,sans-serif;letter-spacing:.08em;border-radius:3px}
.btn.warn{color:var(--rd);border-color:rgba(255,45,85,.5)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="sky"></div><div class="horizon"></div><div class="floor"></div><div class="teams" id="teams"></div><div class="scan"></div>
<div id="app"></div>
<script>
// ================= CONFIG =================
const SB='https://wcwxqdjfoltvcxdgcyts.supabase.co';
const ANON='sb_publishable_ML3LRqQ8f7IeRkc4L1-S2A_wDHYBPfO';
const ESPN='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const STATS={KXNBAPRA:[0,1,2],KXNBAPTS:[0],KXNBAREB:[1],KXNBAAST:[2]};
const AL=c=>({GSW:['GS','GSW'],SAS:['SA','SAS'],NYK:['NY','NYK'],NOP:['NO','NOP'],UTA:['UTAH','UTA'],WAS:['WSH','WAS'],PHX:['PHX','PHO']})[c]||[c];
const MON={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};
const PAL=['#ffc72c','#6f8fd8','#ff3b6b','#c9d6dc','#ff8a1f','#78be20','#ff4a4a','#19d36b'];

// ================= STATE =================
const $=s=>document.getElementById(s);
const num=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const norm=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').replace(/\b(jr|sr|ii|iii)\b/g,'').replace(/\s+/g,' ').trim();
const ini=n=>n.replace(/[^A-Za-z .'-]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem('pt-auth')||'null')}catch(e){}
const saveAuth=()=>{try{AUTH?localStorage.setItem('pt-auth',JSON.stringify(AUTH)):localStorage.removeItem('pt-auth')}catch(e){}};
let PS={ok:false,err:'',at:0,loaded:false};          // positions feed status
let TICKETS=[],LEGS=[],GAMES=[],MK={};              // derived from positions
let F={games:{},stats:{},ok:false,err:'',at:0};      // ESPN live feed
let filter='all',LAST='',LOGIN_MSG='',busy=false;

// ================= AUTH =================
async function authCall(path,body){
  const r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Request failed');
  return d;
}
function setAuth(d){AUTH={tok:d.access_token,ref:d.refresh_token,exp:Date.now()+Math.max(60,(d.expires_in||3600)-60)*1000,email:(d.user&&d.user.email)||(AUTH&&AUTH.email)||''};saveAuth()}
async function token(){
  if(!AUTH)return null;
  if(Date.now()>AUTH.exp){try{setAuth(await authCall('token?grant_type=refresh_token',{refresh_token:AUTH.ref}))}catch(e){AUTH=null;saveAuth();render()}}
  return AUTH&&AUTH.tok;
}
async function doLogin(mode){
  const email=$('em').value.trim(),password=$('pw').value;
  if(!email||!password){setMsg('Enter email and password');return}
  busy=true;setMsg(mode==='up'?'Creating account…':'Signing in…');
  try{
    if(mode==='up'){
      const d=await authCall('signup',{email,password});
      if(d.access_token){setAuth(d)}else{setMsg('Account created. Confirm the email Supabase sent you, then sign in.');busy=false;return}
    }else setAuth(await authCall('token?grant_type=password',{email,password}));
    busy=false;LAST='';render();pollPos();
  }catch(e){busy=false;setMsg(String(e.message||e))}
}
function setMsg(t){LOGIN_MSG=t;const m=$('msg');if(m)m.textContent=t}

// ================= POSITIONS (Supabase edge function -> Kalshi) =================
const evOf=m=>m.event_ticker||String(m.ticker).split('-').slice(0,2).join('-');
function parseEv(ev){
  const m=/^(KX[A-Z0-9]+)-(\d{2})([A-Z]{3})(\d{2})([A-Z]{6})$/.exec(ev);
  if(!m)return {away:'',home:'',date:'',series:String(ev).split('-')[0]};
  return {series:m[1],away:m[5].slice(0,3),home:m[5].slice(3),date:'20'+m[2]+(MON[m[3]]||'01')+m[4]};
}
function yesProb(m){
  if(m.result==='yes')return 1;if(m.result==='no')return 0;
  const bid=m.yes_bid_dollars!=null?num(m.yes_bid_dollars):num(m.yes_bid)/100;
  const ask=m.yes_ask_dollars!=null?num(m.yes_ask_dollars):num(m.yes_ask)/100;
  const last=m.last_price_dollars!=null?num(m.last_price_dollars):num(m.last_price)/100;
  return ask>0?(bid+ask)/2:last;
}
function legFrom(ticker,side,markets){
  const m=markets[ticker];if(!m)return null;
  const sub=String(m.yes_sub_title||'');const nm=sub.split(':')[0].trim();
  const t=/(\d+(?:\.\d+)?)\+/.exec(sub);
  const thr=t?+t[1]:(m.floor_strike!=null?Math.ceil(num(m.floor_strike)):0);
  const ev=evOf(m),pe=parseEv(ev);
  return {id:ticker+':'+side,ticker,side,yes:side==='yes',name:nm||m.title||ticker,thr,stat:STATS[pe.series]||null,g:ev,m};
}
function build(d){
  MK=d.markets||{};const legs={},tickets=[];
  for(const p of d.positions||[]){
    const n=num(p.position_fp!=null?p.position_fp:p.position);if(!n)continue;
    const m=MK[p.ticker]||{};
    const cost=p.market_exposure_dollars!=null?num(p.market_exposure_dollars):num(p.market_exposure)/100;
    let ids=[];let kind='single';
    if(Array.isArray(m.mve_selected_legs)&&m.mve_selected_legs.length){
      kind='combo';
      for(const l of m.mve_selected_legs){const lg=legFrom(l.market_ticker,(l.side||'yes').toLowerCase(),MK);if(lg){legs[lg.id]=lg;ids.push(lg.id)}}
    }else{
      const lg=legFrom(p.ticker,n>0?'yes':'no',MK);if(lg){legs[lg.id]=lg;ids.push(lg.id)}
    }
    tickets.push({id:p.ticker,kind,n:Math.abs(n),cost,payout:Math.abs(n),ids,against:kind==='combo'&&n<0});
  }
  LEGS=Object.values(legs);TICKETS=tickets;
  const gm={};
  LEGS.forEach(l=>{if(!gm[l.g]){const pe=parseEv(l.g);gm[l.g]={id:l.g,away:pe.away,home:pe.home,date:pe.date}}});
  GAMES=Object.values(gm).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
}
async function pollPos(){
  const t=await token();if(!t)return;
  try{
    const r=await fetch(SB+'/functions/v1/kalshi-positions',{method:'POST',headers:{Authorization:'Bearer '+t,apikey:ANON,'Content-Type':'application/json'},body:'{}'});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){AUTH=null;saveAuth();LAST='';render();return}
    if(!r.ok||d.error){PS={ok:false,err:d.error||('HTTP '+r.status),at:Date.now(),loaded:true}}
    else{build(d);PS={ok:true,err:'',at:Date.now(),loaded:true}}
  }catch(e){PS={ok:false,err:String(e&&e.message||e),at:Date.now(),loaded:true}}
  softRender();
}

// ================= LIVE GAME FEED (ESPN, every 1s) =================
async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
let polling=false;
async function pollEspn(){
  if(polling||!AUTH||!GAMES.length)return;polling=true;
  try{
    const dates=[...new Set(GAMES.map(g=>g.date).filter(Boolean))];
    const sbs={};await Promise.all(dates.map(async d=>{try{sbs[d]=await j(ESPN+'/scoreboard?dates='+d+'&limit=50')}catch(e){}}));
    const ng={},ns={};
    await Promise.all(GAMES.map(async g=>{
      const sb=sbs[g.date];if(!sb)return;
      const ev=(sb.events||[]).find(e=>{const cs=(e.competitions&&e.competitions[0]?e.competitions[0].competitors:[]).map(c=>c.team&&c.team.abbreviation);return AL(g.away).some(a=>cs.includes(a))&&AL(g.home).some(a=>cs.includes(a))});
      if(!ev)return;
      const cs=ev.competitions[0].competitors;
      const A=cs.find(c=>AL(g.away).includes(c.team.abbreviation)),H=cs.find(c=>AL(g.home).includes(c.team.abbreviation));
      const stt=(ev.status&&ev.status.type&&ev.status.type.state)||'pre';
      ng[g.id]={a:+A.score||0,h:+H.score||0,q:Math.max(1,(ev.status&&ev.status.period)||1),clk:String((ev.status&&ev.status.displayClock)||'12:00'),state:stt==='in'?'live':stt==='post'?'final':'pre',tip:ev.date};
      if(stt==='pre')return;
      try{
        const sm=await j(ESPN+'/summary?event='+ev.id);const rows={};
        for(const t of (sm.boxscore&&sm.boxscore.players)||[]){for(const blk of t.statistics||[]){
          const L=blk.labels||[],ip=L.indexOf('PTS'),ir=L.indexOf('REB'),ia=L.indexOf('AST');if(ip<0||ir<0||ia<0)continue;
          for(const at of blk.athletes||[]){const s=at.stats||[];rows[norm(at.athlete&&at.athlete.displayName)]=[+s[ip]||0,+s[ir]||0,+s[ia]||0]}
        }}
        LEGS.filter(l=>l.g===g.id).forEach(l=>{ns[l.id]=rows[norm(l.name)]||[0,0,0]});
      }catch(e){}
    }));
    F.games=ng;F.stats=ns;F.ok=Object.keys(ng).length>0;F.err=F.ok?'':'Games not on the feed yet';F.at=Date.now();
  }catch(e){F.ok=false;F.err=String(e&&e.message||e);F.at=Date.now()}
  polling=false;softRender();
}

// ================= LEG LOGIC =================
const gameOf=l=>GAMES.find(g=>g.id===l.g);
const fg=g=>F.games[g.id]||null;
function gstate(g){const f=fg(g);return f?f.state:'pre'}
function elapsed(g){
  const f=fg(g);if(!f)return 0;const m=/^(\d{1,2}):(\d{2})/.exec(f.clk||'');
  const rem=m?(+m[1]+ +m[2]/60):(/^\d+(\.\d+)?$/.test(f.clk||'')?parseFloat(f.clk)/60:12);
  return f.q<=4?(f.q-1)*12+(12-Math.min(12,rem)):48+(f.q-5)*5+(5-Math.min(5,rem));
}
function pct(l){const y=yesProb(l.m);return Math.round((l.yes?y:1-y)*100)}
function info(l){
  const g=gameOf(l),gst=g?gstate(g):'pre';
  const s=F.stats[l.id];
  const tot=(l.stat&&s)?l.stat.reduce((a,i)=>a+s[i],0):0;
  const need=l.thr-tot;
  const settled=l.m&&(l.m.result==='yes'||l.m.result==='no');
  let res;
  if(settled){res=((l.m.result==='yes')===l.yes)?'won':'lost'}
  else if(l.yes){res=tot>=l.thr?'won':(gst==='final'&&l.stat?'lost':'alive')}
  else{res=tot>=l.thr?'lost':(gst==='final'&&l.stat?'won':'alive')}
  const danger=!l.yes&&res==='alive'&&need<=5&&gst!=='pre'&&!!l.stat;
  const el=g?elapsed(g):0;
  const proj=(gst==='live'&&el>=3&&l.stat)?tot/el*48:null;
  return {tot,need,res,danger,proj,gst,s,tracked:!!(l.stat&&s)};
}
function ticketStatus(t,infos){
  const rs=t.ids.map(id=>infos[id]&&infos[id].res);
  let lost=rs.includes('lost'),won=rs.length&&rs.every(r=>r==='won');
  if(t.against){[lost,won]=[rs.includes('lost'),rs.length&&rs.every(r=>r==='won')];return rs.length&&rs.some(r=>r==='lost')?'cashed':(won?'dead':'alive')}
  return lost?'dead':(won?'cashed':'alive');
}

// ================= RENDER =================
const fmt$=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function loginView(){
  return `<div class="top"><div class="row"><h1>Prop <em>Grid</em></h1></div>
  <div style="margin:14px 0 4px;color:var(--mut);font-size:14px;line-height:1.4">Sign in to load your open Kalshi positions.</div>
  <form id="lf" autocomplete="on">
   <input id="em" class="fld" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
   <input id="pw" class="fld" type="password" placeholder="Password" autocomplete="current-password">
   <div class="row" style="margin-top:10px;gap:10px"><button class="chip on" type="submit" style="flex:1">Sign in</button><button class="chip" type="button" id="su" style="flex:1">Create account</button></div>
  </form><div id="msg" class="meta" style="margin-top:10px">${LOGIN_MSG}</div></div>`;
}
function render(){
  if(!AUTH){const h=loginView();if(h!==LAST){LAST=h;$('app').innerHTML=h}tags([]);return}
  const infos={};LEGS.forEach(l=>infos[l.id]=info(l));
  const all=LEGS.map(l=>({l,i:infos[l.id]}));
  const won=all.filter(x=>x.i.res==='won').length,lost=all.filter(x=>x.i.res==='lost').length,alive=all.length-won-lost;
  const stat=TICKETS.map(t=>ticketStatus(t,infos));
  const dead=stat.filter(s=>s==='dead').length,cashed=stat.filter(s=>s==='cashed').length;
  const hd=!TICKETS.length?['NO OPEN TICKETS','alive']:dead&&dead===TICKETS.length?['TICKET DEAD','dead']:cashed&&cashed===TICKETS.length?['TICKET CASHED','cashed']:['TICKETS LIVE','alive'];
  let h=`<div class="top"><div class="row"><h1>Prop <em>Grid</em></h1><div class="clock" id="now"></div></div>
  <div class="tick"><div class="big ${hd[1]}">${hd[0]}</div><div style="text-align:right;font-size:12px;color:var(--mut)">${TICKETS.length} open position${TICKETS.length===1?'':'s'}</div></div>
  <div class="stats"><div class="stat"><b>${LEGS.length}</b><span>Legs</span></div><div class="stat"><b style="color:var(--lm)">${won}</b><span>Hit</span></div><div class="stat"><b style="color:var(--cy)">${alive}</b><span>Alive</span></div><div class="stat"><b style="color:var(--rd)">${lost}</b><span>Busted</span></div></div>`;
  TICKETS.forEach((t,k)=>{
    const odds=t.ids.reduce((a,id)=>a*(pct(LEGS.find(l=>l.id===id))/100),1);
    const st=stat[k],cl=st==='dead'?'t-lost':st==='cashed'?'t-won':'t-alive';
    h+=`<div class="tk"><div><b>${t.kind==='combo'?'COMBO · '+t.ids.length+' legs':'SINGLE'}</b><span>${t.n.toLocaleString()}× · ${fmt$(t.cost)} → ${fmt$(t.payout)}</span></div><div style="text-align:right"><span class="tag ${cl}">${st.toUpperCase()}</span><span>${t.kind==='combo'?'odds '+(odds*100).toFixed(2)+'%':''}</span></div></div>`;
  });
  h+=`<div class="meta"><span id="kfeed"></span></div><div class="meta"><span id="feed"></span></div></div>
  <div class="filters">${[['all','All'],['alive','Alive'],['danger','Danger'],['won','Hit'],['lost','Busted'],['yes','YES legs'],['no','NO legs']].map(f=>`<button class="chip ${filter===f[0]?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>`;
  if(!PS.loaded)h+=`<div class="gh" style="margin-top:16px;text-align:center;color:var(--mut)">Loading your Kalshi positions…</div>`;
  else if(!PS.ok&&!LEGS.length)h+=`<div class="gh" style="margin-top:16px"><div class="gt">Can't load positions</div><div class="wp" style="margin-top:8px;color:var(--or)">${PS.err}</div></div>`;
  else if(!LEGS.length)h+=`<div class="gh" style="margin-top:16px;text-align:center"><div class="gt" style="justify-content:center">No open Kalshi positions</div><div class="wp" style="margin-top:8px">Place a bet on Kalshi and it will appear here within a few seconds.</div></div>`;
  GAMES.forEach(g=>{
    const f=fg(g),gst=gstate(g),bc=gst==='pre'?'b-pre':gst==='live'?'b-live live':'b-final';
    const bl=gst==='pre'?'Pregame':gst==='live'?'Live':'Final';
    const clk=!f?'WAITING FOR GAME FEED':gst==='pre'?'TIP-OFF '+new Date(f.tip).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})+' CT':gst==='final'?'FINAL':(f.q<5?'Q'+f.q:'OT'+(f.q>5?f.q-4:''))+' · '+f.clk;
    h+=`<div class="game"><div class="gh"><div class="gt"><span>${g.away} @ ${g.home}</span><span class="badge ${bc}">${bl}</span></div>
    <div class="score"><div class="team">${g.away}<div class="sc">${f?f.a:'–'}</div></div><div class="dash">–</div><div class="team">${g.home}<div class="sc">${f?f.h:'–'}</div></div></div>
    <div class="ctrl"><span class="clk">${clk}</span></div></div>`;
    all.filter(x=>x.l.g===g.id).forEach(({l,i})=>{
      const show=filter==='all'||(filter==='alive'&&i.res==='alive')||(filter==='danger'&&i.danger)||(filter==='won'&&i.res==='won')||(filter==='lost'&&i.res==='lost')||(filter==='yes'&&l.yes)||(filter==='no'&&!l.yes);
      if(!show)return;
      const cls=i.danger?'danger':i.res,fill=l.stat?Math.min(100,i.tot/l.thr*100):0;
      const col=l.yes?'var(--lm)':(fill>=100?'var(--rd)':fill>=75?'var(--or)':'var(--cy)');
      let tag,sub;
      if(i.res==='won'){tag=['WON','t-won'];sub=l.stat&&l.yes?'Cleared by '+Math.max(0,i.tot-l.thr):'Stayed under'}
      else if(i.res==='lost'){tag=['BUSTED','t-lost'];sub=l.stat&&!l.yes?'Went over by '+Math.max(0,i.tot-l.thr):'Finished short'}
      else if(!l.stat){tag=['LIVE PRICE ONLY','t-alive'];sub='stat not tracked'}
      else if(l.yes){tag=['NEEDS '+i.need,'t-alive'];sub=i.proj!=null?'Pace '+i.proj.toFixed(1):'—'}
      else{tag=[i.danger?'DANGER · '+i.need+' LEFT':'CUSHION '+i.need,i.danger?'t-danger':'t-alive'];sub=i.proj!=null?'Pace '+i.proj.toFixed(1):'—'}
      const v=i.s||[0,0,0],lab=l.stat?l.stat.map(k=>['PTS','REB','AST'][k]).join('·'):'';
      h+=`<div class="leg ${cls}"><div class="lh"><div class="av ${l.yes?'ay':'an'}">${ini(l.name)}</div><div class="who"><div class="nm">${l.name}</div><div class="ln"><span class="side ${l.yes?'s-yes':'s-no'}">${l.yes?'YES':'NO'}</span>${l.thr}+ ${lab||'PROP'}</div></div>
      <div class="pct"><b>${pct(l)}%</b><span>Kalshi live</span></div></div>
      <div class="bar"><i style="width:${fill}%;background:${col};color:${col}"></i></div>
      <div class="st"><span><b>${i.tot}</b> / ${l.thr} (${fill.toFixed(0)}%)</span><span class="tag ${tag[1]}">${tag[0]}</span><span>${sub}</span></div>
      <div class="steps">${['PTS','REB','AST'].map((n,k)=>`<div class="stp"><label>${n}</label><div class="v"><span class="n">${i.tracked?v[k]:'–'}</span></div></div>`).join('')}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="foot"><button class="btn" id="out">Sign out${AUTH.email?' · '+AUTH.email:''}</button></div>
  <div class="note">Positions sync from Kalshi every 5s; scores, clock and player stats update every second.<br>Percentages are the live Kalshi price for your side of each leg. NO legs bust when the player reaches the line.</div>`;
  if(h!==LAST){LAST=h;$('app').innerHTML=h}
  tags(GAMES);tick();
}
function softRender(){const a=document.activeElement;if(a&&['INPUT','SELECT'].includes(a.tagName))tick();else render()}
let TAGKEY='';
function tags(gs){
  const codes=[...new Set(gs.flatMap(g=>[g.away,g.home]).filter(Boolean))].slice(0,8);
  const key=codes.join(',');if(key===TAGKEY)return;TAGKEY=key;
  const pos=[[6,8],[62,14],[8,32],[64,40],[10,58],[60,66],[12,80],[58,88]];
  $('teams').innerHTML=codes.map((c,i)=>`<span class="tm" style="--tc:${PAL[i%8]};left:${pos[i][0]}%;top:${pos[i][1]}%;animation-delay:${-3*i}s">${c}</span>`).join('');
}
function tick(){
  const n=$('now');if(n)n.textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit'})+' CT';
  const ago=t=>Math.max(0,Math.round((Date.now()-t)/1000))+'s ago';
  const k=$('kfeed');if(k){
    if(!PS.loaded)k.textContent='Connecting to Kalshi…';
    else if(PS.ok)k.innerHTML='<span style="color:var(--lm)">●</span> Kalshi positions synced '+ago(PS.at)+' · every 5s';
    else k.innerHTML='<span style="color:var(--or)">●</span> Kalshi sync problem: '+PS.err;
  }
  const f=$('feed');if(f){
    if(!GAMES.length)f.textContent='';
    else if(F.ok)f.innerHTML='<span style="color:var(--lm)">●</span> Game feed updated '+ago(F.at)+' · every 1s';
    else if(!F.at)f.textContent='Connecting to game feed…';
    else f.innerHTML='<span style="color:var(--or)">●</span> Game feed unavailable ('+F.err+') · retrying';
  }
}

// ================= EVENTS =================
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='su'){doLogin('up');return}
  if(b.id==='out'){AUTH=null;saveAuth();TICKETS=[];LEGS=[];GAMES=[];PS={ok:false,err:'',at:0,loaded:false};F={games:{},stats:{},ok:false,err:'',at:0};LAST='';render();return}
  if(b.dataset.f){filter=b.dataset.f;render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='lf'){e.preventDefault();doLogin('in')}});
render();
setInterval(tick,1000);
if(AUTH){pollPos()}
setInterval(pollPos,5000);
setInterval(pollEspn,1000);
</script>
