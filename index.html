<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Props Tracker — 23-Leg Combo</title>
<style>
:root{--bg:#0b0d0e;--card:#14181a;--card2:#1a1f22;--line:#262d31;--tx:#e8eef0;--mut:#7d8b91;--g:#19d38a;--r:#ff5468;--a:#ffb347;--b:#5aa9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:12px 12px 60px;max-width:640px;margin:0 auto}
.top{background:linear-gradient(180deg,#111816,#0f1415);border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
.clock{font:600 13px ui-monospace,Menlo,monospace;color:var(--mut)}
.tick{margin-top:10px;display:flex;align-items:baseline;justify-content:space-between}
.tick .big{font-size:22px;font-weight:800}
.alive{color:var(--g)}.dead{color:var(--r)}.cashed{color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stat{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.meta{font-size:11px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.filters{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:7px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--g);color:#04130c;border-color:var(--g);font-weight:700}
.game{margin-top:16px}
.gh{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.gt{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.badge{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.b-pre{background:#243038;color:var(--b)}.b-live{background:#3a1319;color:var(--r)}.b-final{background:#222;color:var(--mut)}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 8px}
.team{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.team input{display:block;width:64px;margin:4px auto 0;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;font-size:26px;font-weight:800;text-align:center;padding:4px 0}
.dash{color:var(--mut);font-size:20px;margin-top:16px}
.ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
select,.ctrl input{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 8px;font-size:14px}
.ctrl input{width:76px;text-align:center;font-family:ui-monospace,Menlo,monospace}
.wp{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
.leg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.leg.won{border-left-color:var(--g)}.leg.lost{border-left-color:var(--r);opacity:.9}.leg.alive{border-left-color:var(--b)}.leg.danger{border-left-color:var(--a)}
.lh{display:flex;justify-content:space-between;gap:8px}
.nm{font-weight:700;font-size:15px}.ln{font-size:12px;color:var(--mut);margin-top:2px}
.side{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.s-yes{background:#0f3a2a;color:var(--g)}.s-no{background:#3a1c14;color:var(--a)}
.pct{text-align:right}.pct b{font-size:20px}.pct span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar{height:10px;background:var(--card2);border-radius:99px;margin:10px 0 6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .25s}
.st{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.st b{color:var(--tx)}
.tag{font-weight:800;letter-spacing:.04em}
.t-won{color:var(--g)}.t-lost{color:var(--r)}.t-alive{color:var(--b)}.t-danger{color:var(--a)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stp{background:var(--card2);border-radius:12px;padding:6px;text-align:center}
.stp label{font-size:10px;color:var(--mut);letter-spacing:.08em}
.stp .v{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.stp button{width:38px;height:38px;border-radius:10px;border:0;background:#242c30;color:var(--tx);font-size:20px;font-weight:700}
.stp button:active{background:var(--g);color:#000}
.stp .n{font-size:20px;font-weight:800;min-width:22px}
.foot{margin-top:22px;display:flex;gap:8px;justify-content:center}
.btn{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:10px;font-size:13px}
.btn.warn{color:var(--r);border-color:#4a1f27}
.note{font-size:11px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- DATA (from the Kalshi 23-market combo, 11.19.26) ----
const TIP = Date.parse('2026-11-20T01:00:00Z'); // 7:00 PM CST, all four games
const GAMES = [
 {id:'gsw',away:'GSW',home:'MEM',title:'Warriors @ Grizzlies',wp:'MEM 65.7% · GSW 34.3%',legs:[
  ['Cameron Boozer',25,1,83],['Jaylen Wells',10,1,81]]},
 {id:'lac',away:'LAC',home:'SAS',title:'Clippers @ Spurs',wp:'SAS 89% · LAC 11%',legs:[
  ['Brook Lopez',25,0,78],['Darius Garland',25,1,70],['Derrick Jones Jr.',20,0,80],['Keaton Wagler',20,0,73],
  ['Rui Hachimura',25,0,90],["De'Aaron Fox",30,0,71],['Devin Vassell',25,0,78],['Stephon Castle',25,1,74],['Victor Wembanyama',40,1,64]]},
 {id:'nyk',away:'NYK',home:'MIN',title:'Knicks @ Timberwolves',wp:'NYK 51.1% · MIN 48.9%',legs:[
  ['Jonathan Kuminga',30,0,88],['Jaden McDaniels',30,0,74],['LaMelo Ball',25,1,72],['Rudy Gobert',25,0,75],
  ['Jalen Brunson',30,1,72],['Josh Hart',15,1,69],['Karl-Anthony Towns',35,1,64],['Landry Shamet',20,0,84],
  ['Mikal Bridges',20,0,73],['OG Anunoby',30,0,83]]},
 {id:'por',away:'POR',home:'MIL',title:'Trail Blazers @ Bucks',wp:'POR 82.2% · MIL 17.8%',legs:[
  ['Damian Lillard',35,0,62],['Sidy Cissoko',10,1,78]]}
];
const LEGS = [];
GAMES.forEach(g=>g.legs.forEach((l,i)=>LEGS.push({id:g.id+i,g:g.id,name:l[0],thr:l[1],yes:!!l[2],pct:l[3]})));
const COST=9.76, PAYOUT=4166.66;

// ---- STATE ----
const KEY='props-tracker-1119';
let S={stats:{},games:{}};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.stats)S=x}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const gs=id=>S.games[id]||(S.games[id]={a:0,h:0,q:1,clk:'12:00',st:'auto'});
const st=id=>S.stats[id]||(S.stats[id]=[0,0,0]);

function gameState(g){
  const s=gs(g.id).st;
  if(s==='final')return 'final';
  if(s==='live')return 'live';
  return Date.now()>=TIP?'live':'pre';
}
function elapsed(g){
  const o=gs(g.id);const m=/^(\d{1,2}):(\d{2})$/.exec(o.clk||'');
  const rem=m?(+m[1]+ +m[2]/60):12;
  if(o.q<=4)return (o.q-1)*12+(12-Math.min(12,rem));
  return 48+(o.q-5)*5+(5-Math.min(5,rem));
}
function legInfo(l){
  const g=GAMES.find(x=>x.id===l.g);const gst=gameState(g);
  const [p,r,a]=st(l.id);const pra=p+r+a;const need=l.thr-pra;
  let res;
  if(l.yes){res=pra>=l.thr?'won':(gst==='final'?'lost':'alive')}
  else{res=pra>=l.thr?'lost':(gst==='final'?'won':'alive')}
  let danger=!l.yes&&res==='alive'&&need<=5&&gst!=='pre';
  const el=elapsed(g);
  const proj=(gst==='live'&&el>=3)?pra/el*48:null;
  return {pra,need,res,danger,proj,gst};
}

// ---- RENDER ----
let filter='all';
const $=s=>document.getElementById(s);
function fmtTime(ms){
  if(ms<=0)return null;const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+'h ':'')+m+'m '+String(x).padStart(2,'0')+'s';
}
function render(){
  const infos=LEGS.map(l=>({l,i:legInfo(l)}));
  const won=infos.filter(x=>x.i.res==='won').length,lost=infos.filter(x=>x.i.res==='lost').length;
  const alive=infos.length-won-lost;
  const prob=LEGS.reduce((a,l)=>a*(l.pct/100),1);
  const tk=lost>0?['TICKET DEAD','dead']:(won===LEGS.length?['TICKET CASHED','cashed']:['TICKET ALIVE','alive']);
  let h=`<div class="top"><div class="row"><h1>23-Leg Combo · Props</h1><div class="clock" id="now"></div></div>
  <div class="tick"><div class="big ${tk[1]}">${tk[0]}</div><div style="text-align:right;font-size:12px;color:var(--mut)">$${COST.toFixed(2)} → <b style="color:var(--tx)">$${PAYOUT.toLocaleString()}</b></div></div>
  <div class="stats"><div class="stat"><b>${LEGS.length}</b><span>Legs</span></div><div class="stat"><b style="color:var(--g)">${won}</b><span>Hit</span></div><div class="stat"><b style="color:var(--b)">${alive}</b><span>Alive</span></div><div class="stat"><b style="color:var(--r)">${lost}</b><span>Busted</span></div></div>
  <div class="meta"><span>Combined leg odds (product): <b style="color:var(--tx)">${(prob*100).toFixed(3)}%</b></span><span id="cd"></span></div></div>
  <div class="filters">${[['all','All'],['alive','Alive'],['danger','Danger'],['won','Hit'],['lost','Busted'],['yes','YES legs'],['no','NO legs']].map(f=>`<button class="chip ${filter===f[0]?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>`;
  GAMES.forEach(g=>{
    const o=gs(g.id),gst=gameState(g);
    const bc=gst==='pre'?'b-pre':gst==='live'?'b-live':'b-final';
    const bl=gst==='pre'?'Pregame · 7:00 PM CT':gst==='live'?'Live':'Final';
    h+=`<div class="game"><div class="gh"><div class="gt"><span>${g.title}</span><span class="badge ${bc}">${bl}</span></div>
    <div class="score"><div class="team">${g.away}<input type="number" inputmode="numeric" min="0" data-g="${g.id}" data-k="a" value="${o.a}"></div><div class="dash">–</div><div class="team">${g.home}<input type="number" inputmode="numeric" min="0" data-g="${g.id}" data-k="h" value="${o.h}"></div></div>
    <div class="ctrl"><select data-g="${g.id}" data-k="q">${[1,2,3,4,5].map(q=>`<option value="${q}" ${o.q==q?'selected':''}>${q<5?'Q'+q:'OT'}</option>`).join('')}</select>
    <input type="text" inputmode="numeric" placeholder="12:00" data-g="${g.id}" data-k="clk" value="${o.clk}">
    <select data-g="${g.id}" data-k="st"><option value="auto" ${o.st==='auto'?'selected':''}>Auto</option><option value="live" ${o.st==='live'?'selected':''}>Live</option><option value="final" ${o.st==='final'?'selected':''}>Final</option></select></div>
    <div class="wp">Pregame win prob: ${g.wp}</div></div>`;
    infos.filter(x=>x.l.g===g.id).forEach(({l,i})=>{
      const cls=i.danger&&i.res==='alive'?'danger':i.res;
      const show=filter==='all'||(filter==='alive'&&i.res==='alive')||(filter==='danger'&&i.danger)||(filter==='won'&&i.res==='won')||(filter==='lost'&&i.res==='lost')||(filter==='yes'&&l.yes)||(filter==='no'&&!l.yes);
      if(!show)return;
      const fill=Math.min(100,i.pra/l.thr*100);
      let col=l.yes?'var(--g)':(fill>=100?'var(--r)':fill>=75?'var(--a)':'var(--b)');
      let tag,sub;
      if(i.res==='won'){tag=['WON','t-won'];sub=l.yes?`Cleared by ${i.pra-l.thr}`:`Stayed under`}
      else if(i.res==='lost'){tag=['BUSTED','t-lost'];sub=l.yes?'Finished short':`Went over by ${i.pra-l.thr}`}
      else if(l.yes){tag=['NEEDS '+i.need,'t-alive'];sub=i.proj!=null?`Pace ${i.proj.toFixed(1)}`:'—'}
      else{tag=[i.danger?'DANGER · '+i.need+' LEFT':'CUSHION '+i.need,i.danger?'t-danger':'t-alive'];sub=i.proj!=null?`Pace ${i.proj.toFixed(1)}`:'—'}
      const v=st(l.id);
      h+=`<div class="leg ${cls}"><div class="lh"><div><div class="nm"><span class="side ${l.yes?'s-yes':'s-no'}">${l.yes?'YES':'NO'}</span>${l.name}</div><div class="ln">${l.thr}+ pts + reb + ast</div></div>
      <div class="pct"><b>${l.pct}%</b><span>Kalshi</span></div></div>
      <div class="bar"><i style="width:${fill}%;background:${col}"></i></div>
      <div class="st"><span><b>${i.pra}</b> / ${l.thr} PRA (${fill.toFixed(0)}%)</span><span class="tag ${tag[1]}">${tag[0]}</span><span>${sub}</span></div>
      <div class="steps">${['PTS','REB','AST'].map((n,k)=>`<div class="stp"><label>${n}</label><div class="v"><button data-l="${l.id}" data-k="${k}" data-d="-1">−</button><span class="n">${v[k]}</span><button data-l="${l.id}" data-k="${k}" data-d="1">+</button></div></div>`).join('')}</div></div>`;
    });
  });
  h+=`<div class="foot"><button class="btn warn" id="reset">Reset all stats</button></div>
  <div class="note">Tap + / − as stats come in and set score, quarter and clock per game.<br>Percentages: Kalshi = leg probability at entry · bar = progress to the line. NO legs bust when the player reaches the line. All 23 legs must hit.<br>Data entered here saves on this device only.</div>`;
  $('app').innerHTML=h;
  tickTime();
}
function tickTime(){
  const n=$('now');if(!n)return;
  const d=new Date();
  n.textContent=d.toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit'})+' CT';
  const c=$('cd');if(c){const t=fmtTime(TIP-Date.now());c.textContent=t?'Tip-off in '+t:'Games underway'}
}
let wasLive=Date.now()>=TIP;
setInterval(()=>{tickTime();const nl=Date.now()>=TIP;if(nl!==wasLive){wasLive=nl;render()}},1000);

// ---- EVENTS ----
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f){filter=b.dataset.f;render();return}
  if(b.dataset.l){const v=st(b.dataset.l);const k=+b.dataset.k;v[k]=Math.max(0,v[k]+ +b.dataset.d);save();render();return}
  if(b.id==='reset'){
    if(b.dataset.armed){S={stats:{},games:{}};save();render()}
    else{b.dataset.armed=1;b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset all stats'}},3000)}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.g)return;
  const o=gs(t.dataset.g),k=t.dataset.k;
  if(k==='a'||k==='h')o[k]=Math.max(0,parseInt(t.value)||0);
  else if(k==='q')o.q=+t.value;
  else if(k==='clk'){let v=t.value.trim();if(/^\d{1,2}$/.test(v))v+=':00';o.clk=/^\d{1,2}:\d{2}$/.test(v)?v:'12:00'}
  else if(k==='st')o.st=t.value;
  save();render();
});
render();
</script>
</body>
</html>
