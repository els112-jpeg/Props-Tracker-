<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Props Tracker — 23-Leg Combo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ff;--cy:#2563eb;--mg:#7c3aed;--or:#d97706;--lm:#16a34a;--rd:#e11d48;--tx:#0f172a;--mut:#64748b;--pn:rgba(255,255,255,.55);--ln:rgba(255,255,255,.7);--sh:0 10px 34px rgba(30,41,120,.10),inset 0 1px 0 rgba(255,255,255,.95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
body{padding:14px 14px 104px;max-width:660px;margin:0 auto;position:relative;min-height:100vh}
.sky{position:fixed;inset:0;z-index:-3;background:radial-gradient(45% 32% at 12% 8%,rgba(99,102,241,.30),transparent 70%),radial-gradient(40% 32% at 92% 26%,rgba(56,189,248,.32),transparent 70%),radial-gradient(45% 36% at 25% 96%,rgba(52,211,153,.28),transparent 70%),radial-gradient(35% 30% at 85% 88%,rgba(244,114,182,.20),transparent 70%),linear-gradient(160deg,#f4f7ff,#f3effe 50%,#ecfbf6)}
.floor,.horizon,.scan,.teams{display:none}
/* glass */
.top,.gh,.leg,.panel,.stat,.sheet,.nav,.tk,.lg,.stp{background:linear-gradient(145deg,rgba(255,255,255,.74),rgba(255,255,255,.40));border:1px solid var(--ln);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--sh)}
.top{position:relative;padding:14px 16px;border-radius:24px}
.top.slim{padding:12px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:800 18px Inter,sans-serif;margin:0;letter-spacing:-.02em;color:var(--tx)}
h1 em{font-style:normal;background:linear-gradient(90deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font:600 12px Inter,monospace;color:var(--mut);font-variant-numeric:tabular-nums}
.tick{margin-top:10px;display:flex;align-items:baseline;justify-content:space-between}
.tick .big{font:800 22px Inter,sans-serif;letter-spacing:-.02em}
.alive{color:var(--cy)}.dead{color:var(--rd)}.cashed{color:var(--lm)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{padding:9px 2px;text-align:center;border-radius:16px;box-shadow:none}
.stat b{display:block;font:800 19px Inter,sans-serif;letter-spacing:-.02em}.stat span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.meta{font-size:11px;color:var(--mut);margin-top:9px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;align-items:center}
.meta b{color:var(--tx)}
.filters{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--ln);background:rgba(255,255,255,.55);backdrop-filter:blur(14px);color:var(--mut);padding:8px 14px;font:600 12px Inter,sans-serif;white-space:nowrap;border-radius:999px;box-shadow:0 2px 10px rgba(30,41,120,.06)}
.chip.on{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.sec{font:700 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:20px 4px 8px}
.game{margin-top:20px}
.gh{padding:14px;border-radius:24px}
.gt{display:flex;justify-content:space-between;align-items:center;font:700 14px Inter,sans-serif;letter-spacing:-.01em}
.badge{font:700 10px Inter,sans-serif;letter-spacing:.08em;padding:4px 10px;text-transform:uppercase;border-radius:999px}
.b-pre{background:rgba(37,99,235,.12);color:var(--cy)}
.b-live{background:var(--rd);color:#fff;box-shadow:0 4px 14px rgba(225,29,72,.4)}.live{animation:pulse 1.2s ease-in-out infinite}
.b-final{background:rgba(100,116,139,.15);color:var(--mut)}
@keyframes pulse{50%{opacity:.72}}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 8px}
.team{text-align:center;font:700 12px Inter,sans-serif;color:var(--mut);letter-spacing:.1em}
.team input,.sc{display:block;margin:4px auto 0;min-width:76px;width:76px;background:rgba(255,255,255,.6);border:1px solid var(--ln);color:var(--tx);font:800 28px Inter,sans-serif;text-align:center;padding:4px 0;border-radius:14px;font-variant-numeric:tabular-nums}
.sc{padding:4px 10px;width:auto}
.team input:disabled{opacity:1}
.clk{font:700 15px Inter,sans-serif;color:var(--or);font-variant-numeric:tabular-nums}
.dash{color:var(--mut);font:700 20px Inter,sans-serif;margin-top:18px}
.ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
select,.ctrl input{background:rgba(255,255,255,.6);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:8px 10px;font:600 14px Inter,sans-serif}
.ctrl input{width:84px;text-align:center}
.wp{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.leg{--c:var(--cy);position:relative;margin-top:12px;padding:14px;border-radius:22px;overflow:hidden}
.leg::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.leg.alive{--c:var(--cy)}.leg.won{--c:var(--lm)}.leg.lost{--c:var(--rd)}.leg.danger{--c:var(--or);animation:dng 1.4s ease-in-out infinite}
@keyframes dng{50%{box-shadow:0 10px 34px rgba(217,119,6,.35),inset 0 1px 0 rgba(255,255,255,.95)}}
.leg.locked{--c:#94a3b8;opacity:.72}
.lh{display:flex;align-items:center;gap:12px}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:700 16px Inter,sans-serif;color:var(--rc);background:linear-gradient(145deg,#fff,rgba(255,255,255,.4));border:2px solid var(--rc);box-shadow:0 6px 16px color-mix(in srgb,var(--rc) 30%,transparent),inset 0 1px 0 #fff}
.ay{--rc:var(--cy)}.an{--rc:var(--mg)}.av.off{--rc:#94a3b8}
.who{flex:1;min-width:0}
.nm{font:700 17px Inter,sans-serif;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{font-size:12px;color:var(--mut);margin-top:2px}
.side{font:700 10px Inter,sans-serif;padding:3px 7px;margin-right:6px;letter-spacing:.06em;border-radius:999px;vertical-align:1px}
.s-yes{background:rgba(37,99,235,.14);color:var(--cy)}.s-no{background:rgba(124,58,237,.14);color:var(--mg)}
.pct{text-align:right;flex:none}.pct b{font:800 24px Inter,sans-serif;color:var(--lm);letter-spacing:-.02em}
.pct span{display:block;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.bar{height:10px;background:rgba(100,116,139,.16);margin:12px 0 7px;position:relative;overflow:hidden;border-radius:999px}
.bar i{display:block;height:100%;transition:width .4s;border-radius:999px;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.bar.sm{height:8px}
.st{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut)}
.st b{color:var(--tx)}
.tag{font:700 11px Inter,sans-serif}
.t-won{color:var(--lm)}.t-lost{color:var(--rd)}.t-alive{color:var(--cy)}.t-danger{color:var(--or)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stp{border-radius:16px;padding:6px;text-align:center;box-shadow:none}
.stp label{font:700 10px Inter,sans-serif;color:var(--mut);letter-spacing:.1em}
.stp .v{display:flex;align-items:center;justify-content:center;margin-top:3px}
.stp button{width:33px;height:36px;border:0;background:rgba(37,99,235,.1);color:var(--cy);font:700 20px Inter,sans-serif;border-radius:10px}
.stp button:active{background:var(--cy);color:#fff}
.stp .n{font:800 26px Inter,sans-serif;min-width:24px}
.foot{margin-top:24px;display:flex;gap:8px;justify-content:center}
.btn{background:rgba(255,255,255,.65);border:1px solid var(--ln);color:var(--tx);padding:11px 16px;font:600 13px Inter,sans-serif;border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 4px 14px rgba(30,41,120,.08)}
.btn.pri{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(79,70,229,.35)}
.btn.warn{color:var(--rd)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
.fld{display:block;width:100%;margin-top:10px;padding:13px 14px;background:rgba(255,255,255,.65);border:1px solid var(--ln);color:var(--tx);font:500 16px Inter,sans-serif;border-radius:14px;box-shadow:inset 0 1px 3px rgba(30,41,120,.08)}
.tk{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:9px 12px;border-radius:14px;font-size:13px;color:var(--mut);box-shadow:none}
.tk b{display:block;color:var(--tx);font:700 12px Inter,sans-serif}.tk span{display:block}
.panel{padding:14px;border-radius:24px}
.mut{color:var(--mut)}
.cols2{grid-template-columns:1fr 1fr}.cols2 .stat{padding:12px 4px}.cols2 .stat b{font-size:22px}
.barrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.barrow .bar{flex:1;margin:0}.barrow b{font:700 12px Inter,sans-serif;min-width:44px;text-align:right}
.rk{font:700 12px Inter,sans-serif;color:var(--or);width:16px}.nmx{width:122px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{cursor:pointer}
.legs-list{margin-top:8px}
.lg{display:flex;gap:6px;align-items:center;padding:8px 12px;margin-top:6px;border-radius:14px;font-size:14px;box-shadow:none;border-left:3px solid rgba(100,116,139,.3)}
.lg b{margin-left:auto}.lg.ok{border-left-color:var(--lm)}.lg.ok b{color:var(--lm)}.lg.no{border-left-color:var(--rd)}.lg.no b{color:var(--rd)}
.why{margin-top:8px;font-size:12px;color:var(--cy);font-weight:600}
.newtag{font:700 9px Inter,sans-serif;background:var(--mg);color:#fff;padding:2px 7px;border-radius:999px;margin-left:6px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:636px;margin:0 auto;z-index:20;display:flex;justify-content:space-around;padding:8px 6px;border-radius:26px;box-shadow:0 14px 44px rgba(30,41,120,.18),inset 0 1px 0 rgba(255,255,255,.95)}
.nav button{flex:1;max-width:110px;background:none;border:0;color:var(--mut);font:600 10px Inter,sans-serif;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:18px}
.nav button i{font-style:normal;font-size:19px;line-height:1}
.nav button.on{color:var(--cy);background:rgba(37,99,235,.10)}
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.28);backdrop-filter:blur(4px);display:flex;align-items:flex-end}
.sheet{width:100%;max-width:660px;margin:0 auto;max-height:82vh;overflow:auto;padding:18px 18px 30px;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.72));border-radius:28px 28px 0 0;box-shadow:0 -14px 50px rgba(30,41,120,.22)}
.toasts{position:fixed;top:12px;left:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 16px;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border:1px solid var(--ln);color:var(--tx);font:600 13px Inter,sans-serif;box-shadow:0 12px 34px rgba(30,41,120,.2);border-radius:999px}
/* 3D brain */
.treewrap{position:relative;padding:0;overflow:hidden;border-radius:28px}
canvas#tree{display:block;width:100%;height:440px;touch-action:none;cursor:grab}
canvas#tree:active{cursor:grabbing}
.tbar{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 12px 0;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 14px 12px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.rank{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.5);border:1px solid var(--ln)}
.rank .g{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px Inter,sans-serif;color:#fff;flex:none}
.rank .nm{font-size:15px}.rank .v{margin-left:auto;text-align:right;font-weight:700;font-size:14px}
.rank .v small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.sub{margin-top:6px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--ln);display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.sub .v{margin-left:auto;font-weight:700}
@media (prefers-reduced-motion:reduce){.live,.leg.danger{animation:none!important}}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,#2563eb,#7c3aed);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 4px 14px rgba(79,70,229,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px rgba(79,70,229,.5)}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<div class="sky"></div><div class="teams" id="teams"></div>
<div id="app"></div>
<script>
// ================= CONFIG =================
const SB='https://wcwxqdjfoltvcxdgcyts.supabase.co';
const ANON='sb_publishable_ML3LRqQ8f7IeRkc4L1-S2A_wDHYBPfO';
const ESPN='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const STATS={KXNBAPRA:[0,1,2],KXNBAPTS:[0],KXNBAREB:[1],KXNBAAST:[2]};
const AL=c=>({GSW:['GS','GSW'],SAS:['SA','SAS'],NYK:['NY','NYK'],NOP:['NO','NOP'],UTA:['UTAH','UTA'],WAS:['WSH','WAS'],PHX:['PHX','PHO']})[c]||[c];
const MON={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};
const PAL=['#ffc72c','#6f8fd8','#ff3b6b','#c9d6dc','#ff8a1f','#78be20','#ff4a4a','#19d36b'];

// ================= STATE =================
const $=s=>document.getElementById(s);
const num=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const norm=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').replace(/\b(jr|sr|ii|iii)\b/g,'').replace(/\s+/g,' ').trim();
const ini=n=>n.replace(/[^A-Za-z .'-]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem('pt-auth')||'null')}catch(e){}
const saveAuth=()=>{try{AUTH?localStorage.setItem('pt-auth',JSON.stringify(AUTH)):localStorage.removeItem('pt-auth')}catch(e){}};
let PS={ok:false,err:'',at:0,loaded:false};          // positions feed status
let TICKETS=[],LEGS=[],GAMES=[],MK={};              // derived from positions
let F={games:{},stats:{},ok:false,err:'',at:0};      // ESPN live feed
let filter='all',LAST='',LOGIN_MSG='',busy=false;

// ================= AUTH =================
async function authCall(path,body){
  const r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Request failed');
  return d;
}
function setAuth(d){AUTH={tok:d.access_token,ref:d.refresh_token,exp:Date.now()+Math.max(60,(d.expires_in||3600)-60)*1000,email:(d.user&&d.user.email)||(AUTH&&AUTH.email)||''};saveAuth()}
async function token(){
  if(!AUTH)return null;
  if(Date.now()>AUTH.exp){try{setAuth(await authCall('token?grant_type=refresh_token',{refresh_token:AUTH.ref}))}catch(e){AUTH=null;saveAuth();render()}}
  return AUTH&&AUTH.tok;
}
async function doLogin(mode){
  const email=$('em').value.trim(),password=$('pw').value;
  if(!email||!password){setMsg('Enter email and password');return}
  busy=true;setMsg(mode==='up'?'Creating account…':'Signing in…');
  try{
    if(mode==='up'){
      const d=await authCall('signup',{email,password});
      if(d.access_token){setAuth(d)}else{setMsg('Account created. Confirm the email Supabase sent you, then sign in.');busy=false;return}
    }else setAuth(await authCall('token?grant_type=password',{email,password}));
    busy=false;LAST='';render();pollPos();pollHist();pollMkts();
  }catch(e){busy=false;setMsg(String(e.message||e))}
}
function setMsg(t){LOGIN_MSG=t;const m=$('msg');if(m)m.textContent=t}

// ================= POSITIONS (Supabase edge function -> Kalshi) =================
const evOf=m=>m.event_ticker||String(m.ticker).split('-').slice(0,2).join('-');
function parseEv(ev){
  const m=/^(KX[A-Z0-9]+)-(\d{2})([A-Z]{3})(\d{2})([A-Z]{6})$/.exec(ev);
  if(!m)return {away:'',home:'',date:'',series:String(ev).split('-')[0]};
  return {series:m[1],away:m[5].slice(0,3),home:m[5].slice(3),date:'20'+m[2]+(MON[m[3]]||'01')+m[4]};
}
function yesProb(m){
  if(m.result==='yes')return 1;if(m.result==='no')return 0;
  const bid=m.yes_bid_dollars!=null?num(m.yes_bid_dollars):num(m.yes_bid)/100;
  const ask=m.yes_ask_dollars!=null?num(m.yes_ask_dollars):num(m.yes_ask)/100;
  const last=m.last_price_dollars!=null?num(m.last_price_dollars):num(m.last_price)/100;
  return ask>0?(bid+ask)/2:last;
}
function legFrom(ticker,side,markets){
  const m=markets[ticker];if(!m)return null;
  const sub=String(m.yes_sub_title||'');const nm=sub.split(':')[0].trim();
  const t=/(\d+(?:\.\d+)?)\+/.exec(sub);
  const thr=t?+t[1]:(m.floor_strike!=null?Math.ceil(num(m.floor_strike)):0);
  const ev=evOf(m),pe=parseEv(ev);
  return {id:ticker+':'+side,ticker,side,yes:side==='yes',name:nm||m.title||ticker,thr,stat:STATS[pe.series]||null,g:ev,m};
}
function build(d){
  MK=d.markets||{};const legs={},tickets=[];
  for(const p of d.positions||[]){
    const n=num(p.position_fp!=null?p.position_fp:p.position);if(!n)continue;
    const m=MK[p.ticker]||{};
    const cost=p.market_exposure_dollars!=null?num(p.market_exposure_dollars):num(p.market_exposure)/100;
    let ids=[];let kind='single';
    if(Array.isArray(m.mve_selected_legs)&&m.mve_selected_legs.length){
      kind='combo';
      for(const l of m.mve_selected_legs){const lg=legFrom(l.market_ticker,(l.side||'yes').toLowerCase(),MK);if(lg){legs[lg.id]=lg;ids.push(lg.id)}}
    }else{
      const lg=legFrom(p.ticker,n>0?'yes':'no',MK);if(lg){legs[lg.id]=lg;ids.push(lg.id)}
    }
    tickets.push({id:p.ticker,kind,n:Math.abs(n),cost,payout:Math.abs(n),ids,against:kind==='combo'&&n<0});
  }
  LEGS=Object.values(legs);TICKETS=tickets;
  const gm={};
  LEGS.forEach(l=>{if(!gm[l.g]){const pe=parseEv(l.g);gm[l.g]={id:l.g,away:pe.away,home:pe.home,date:pe.date}}});
  GAMES=Object.values(gm).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
}
async function pollPos(){
  const t=await token();if(!t)return;
  try{
    const r=await fetch(SB+'/functions/v1/kalshi-positions',{method:'POST',headers:{Authorization:'Bearer '+t,apikey:ANON,'Content-Type':'application/json'},body:'{}'});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){AUTH=null;saveAuth();LAST='';render();return}
    if(!r.ok||d.error){PS={ok:false,err:d.error||('HTTP '+r.status),at:Date.now(),loaded:true}}
    else{build(d);PS={ok:true,err:'',at:Date.now(),loaded:true}}
  }catch(e){PS={ok:false,err:String(e&&e.message||e),at:Date.now(),loaded:true}}
  softRender();
}

// ================= LIVE GAME FEED (ESPN, every 1s) =================
async function j(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
let polling=false;
async function pollEspn(){
  if(polling||!AUTH||!GAMES.length)return;polling=true;
  try{
    const dates=[...new Set(GAMES.map(g=>g.date).filter(Boolean))];

// ================= LEG LOGIC =================
const gameOf=l=>GAMES.find(g=>g.id===l.g);
const fg=g=>F.games[g.id]||null;
function gstate(g){const f=fg(g);return f?f.state:'pre'}
function elapsed(g){
  const f=fg(g);if(!f)return 0;const m=/^(\d{1,2}):(\d{2})/.exec(f.clk||'');
  const rem=m?(+m[1]+ +m[2]/60):(/^\d+(\.\d+)?$/.test(f.clk||'')?parseFloat(f.clk)/60:12);
  return f.q<=4?(f.q-1)*12+(12-Math.min(12,rem)):48+(f.q-5)*5+(5-Math.min(5,rem));
}
function pct(l){const y=yesProb(l.m);return Math.round((l.yes?y:1-y)*100)}
function info(l){
  const g=gameOf(l),gst=g?gstate(g):'pre';
  const s=F.stats[l.id];
  const tot=(l.stat&&s)?l.stat.reduce((a,i)=>a+s[i],0):0;
  const need=l.thr-tot;
  const settled=l.m&&(l.m.result==='yes'||l.m.result==='no');
  let res;
  if(settled){res=((l.m.result==='yes')===l.yes)?'won':'lost'}
  else if(l.yes){res=tot>=l.thr?'won':(gst==='final'&&l.stat?'lost':'alive')}
  else{res=tot>=l.thr?'lost':(gst==='final'&&l.stat?'won':'alive')}
  const danger=!l.yes&&res==='alive'&&need<=5&&gst!=='pre'&&!!l.stat;
  const el=g?elapsed(g):0;
  const proj=(gst==='live'&&el>=3&&l.stat)?tot/el*48:null;
  return {tot,need,res,danger,proj,gst,s,tracked:!!(l.stat&&s)};
}
function ticketStatus(t,infos){
  const rs=t.ids.map(id=>infos[id]&&infos[id].res);
  let lost=rs.includes('lost'),won=rs.length&&rs.every(r=>r==='won');
  if(t.against){[lost,won]=[rs.includes('lost'),rs.length&&rs.every(r=>r==='won')];return rs.length&&rs.some(r=>r==='lost')?'cashed':(won?'dead':'alive')}
  return lost?'dead':(won?'cashed':'alive');
}

function legHist(ticker,side,mk){
  const m=mk[ticker];if(!m)return null;
  const sub=String(m.yes_sub_title||'');const name=sub.split(':')[0].trim();
  const t=/(\d+(?:\.\d+)?)\+/.exec(sub);const thr=t?+t[1]:(m.floor_strike!=null?Math.ceil(num(m.floor_strike)):0);
  const pe=parseEv(m.event_ticker||String(ticker).split('-').slice(0,2).join('-'));
  const hit=(m.result==='yes'||m.result==='no')?(m.result===side):null;
  return {ticker,name:name||m.title||ticker,thr,side,stat:STATS[pe.series]||null,away:pe.away,home:pe.home,date:pe.date,hit};
}
function buildBets(d){
  const out=[];
  for(const s of d.settlements||[]){
    const tk=s.ticker||s.market_ticker;const m=(d.markets||{})[tk]||{};
    const yc=num(s.yes_count_fp!=null?s.yes_count_fp:s.yes_count),nc=num(s.no_count_fp!=null?s.no_count_fp:s.no_count);
    const contracts=yc+nc;const held=yc>0?'yes':(nc>0?'no':null);
    const cost=cents(s,'yes_total_cost')+cents(s,'no_total_cost');
    const revenue=s.revenue_dollars!=null?num(s.revenue_dollars):num(s.revenue)/100;
    const fee=num(s.fee_cost_dollars!=null?s.fee_cost_dollars:s.fee_cost);
    if(!contracts&&!cost)continue;
    let legs=[],kind='single';
    if(Array.isArray(m.mve_selected_legs)&&m.mve_selected_legs.length){
      kind='combo';legs=m.mve_selected_legs.map(l=>legHist(l.market_ticker,(l.side||'yes').toLowerCase(),d.markets||{})).filter(Boolean);
    }else{const l=held&&legHist(tk,held,d.markets||{});if(l)legs=[l]}
    out.push({id:tk,kind,at:s.settled_time||'',contracts,cost,revenue,fee,profit:revenue-cost-fee,won:revenue>0,legs});
  }
  out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  return out;
}

function computeStats(){

  const chron=[...BETS].reverse();let run=0;
  for(const b of chron){
    if(b.won)st.wins++;st.staked+=b.cost;st.returned+=b.revenue;st.profit+=b.profit;
    run=b.won?(run>0?run+1:1):(run<0?run-1:-1);st.bestStreak=Math.max(st.bestStreak,run);
    if(b.kind==='combo'){bump(st.combos,b.legs.length+' legs',b.won)}
    if(b.kind==='single'&&b.legs[0]&&b.contracts){st.singles.push({price:b.cost/b.contracts,hit:b.legs[0].hit===true})}
    for(const l of b.legs){
      if(l.hit==null)continue;
      st.legs++;if(l.hit)st.hits++;bump(st.side,l.side,l.hit);
      bump(st.players,l.name,l.hit);
      const tm=teamOf(l.name);if(tm)bump(st.teams,tm,l.hit);
      if(l.stat){const k=l.stat.length===3?'PRA':l.stat.map(i=>['PTS','REB','AST'][i]).join('+');(st.thr[k]||(st.thr[k]=[])).push(l.thr)}
    }

  st.streak=run;
  st.roi=st.staked?st.profit/st.staked:0;

}

function legCtx(){
  const out=[],chron=[...BETS].reverse();let prev=null;
  const avg=BETS.length?BETS.reduce((a,b)=>a+b.cost,0)/BETS.length:0;
  chron.forEach(b=>{
    const after=prev==null?'':(prev?'win':'loss');
    for(const l of b.legs){if(l.hit==null)continue;
      out.push({l,b,n:b.legs.length,kind:b.kind,after,big:b.cost>avg,price:(b.kind==='single'&&b.contracts)?b.cost/b.contracts:null,key:KEYOF(l.stat)})}

  });

}

let TREE={yaw:.6,pitch:-.25,vy:0,vp:0,zoom:1,drag:false,moved:0,t0:0,lx:0,ly:0,idle:0,proj:[],layoutKey:'',pos:{}};
function layout(nodes){
  const key=nodes.map(n=>n.id).join();if(key===TREE.layoutKey)return;TREE.layoutKey=key;
  const mains=nodes.filter(n=>!n.parent),pos={};
  mains.forEach((m,i)=>{
    const y=1-2*(i+.5)/mains.length,r=Math.sqrt(1-y*y),a=i*2.399963;
    pos[m.id]=[r*Math.cos(a),y,r*Math.sin(a)];
  });
  mains.forEach(m=>{
    const d=pos[m.id],kids=nodes.filter(n=>n.parent===m.id);
    const h=Math.abs(d[1])<.9?[0,1,0]:[1,0,0];
    let u=[d[1]*h[2]-d[2]*h[1],d[2]*h[0]-d[0]*h[2],d[0]*h[1]-d[1]*h[0]];const ul=Math.hypot(...u)||1;u=u.map(v=>v/ul);
    const w=[d[1]*u[2]-d[2]*u[1],d[2]*u[0]-d[0]*u[2],d[0]*u[1]-d[1]*u[0]];
    kids.forEach((k,j)=>{
      const a=(j/kids.length)*Math.PI*2+m.id.length;
      pos[k.id]=[0,1,2].map(q=>d[q]*1.32+.44*(Math.cos(a)*u[q]+Math.sin(a)*w[q]));
    });
  });
  TREE.pos=pos;
}

function parseLog(d){
  const L=d.labels||[],iM=L.indexOf('MIN'),iP=L.indexOf('PTS'),iR=L.indexOf('REB'),iA=L.indexOf('AST');
  if(iP<0||iR<0||iA<0)return [];
  const ev=d.events||{},out=[];
  for(const st of d.seasonTypes||[]){
    if(/preseason|all.?star/i.test(st.displayName||''))continue;
    for(const cat of st.categories||[])for(const e of cat.events||[]){
      const meta=ev[e.eventId];if(!meta||!e.stats)continue;
      const min=parseFloat(e.stats[iM]);if(!(min>0))continue;
      out.push({date:meta.gameDate||'',opp:(meta.opponent||{}).abbreviation||'',min,v:[+e.stats[iP]||0,+e.stats[iR]||0,+e.stats[iA]||0]});

function riskFor(p,yesMkt){
  const L=PL[p.name];if(!L||L.games.length<8||!p.stat)return null;
  const val=x=>p.stat.reduce((a,i)=>a+x.v[i],0),g=L.games,vals=g.map(val),hit=v=>v>=p.thr;
  const sRate=(vals.filter(hit).length+1)/(vals.length+2);
  const l10=vals.slice(0,10),l10h=l10.filter(hit).length,l10Rate=(l10h+sRate*2)/(l10.length+2);
  const l5avg=mean(vals.slice(0,5)),savg=mean(vals),sd=stdv(vals.slice(0,25))||1;
  const tm=teamOf(p.name),opp=tm?(tm===p.away?p.home:tm===p.home?p.away:''):'';
  const og=opp?g.filter(x=>nab(x.opp)===opp):[],oh=og.filter(x=>hit(val(x))).length;
  const oRate=og.length>=2?(oh+sRate*2)/(og.length+2):null;
  const heat=(l5avg-savg)/sd;
  let pm=oRate!=null?.4*l10Rate+.3*sRate+.3*oRate:.55*l10Rate+.45*sRate;
  pm=clampP(pm+clampP(heat*.04,-.05,.05),.02,.98);

  return {model:pm,mkt:yesMkt,blend,heat,state:heat>=.5?'hot':heat<=-.5?'cold':'steady',l5avg,savg,sd,vol:cv<.25?'low':cv<.4?'medium':'high',oppN:og.length,oppH:oh,opp,l10:l10h+'/'+l10.length,n:vals.length};
}

function picks(){

      const mt=med(s.thr[key]||[]);if(mt){const c=Math.exp(-Math.abs(p.thr-mt)/Math.max(mt,1));comps.push(c);if(c>0.8)why.push('Close to your usual '+mt+'+ line')}

function buildSlip(T){

  [...picks().filter(x=>!x.held).sort((a,b)=>b.rank-a.rank).slice(0,22),...swings().slice(0,10)].forEach(x=>{const k=x.p.m.ticker+x.side;if(!seen.has(k)&&x.mkt>.04){seen.add(k);pool.push(x)}});

  const go=(start,cur,ev,pl,pr,pay)=>{

      if(pay>=T*.85){if(!best||pr>best.pr)best={legs:[...cur],pr,pay}}
      if(!fallback||pay>fallback.pay)fallback={legs:[...cur],pr,pay}}
    if(cur.length>=5)return;
    for(let i=start;i<pool.length;i++){const x=pool[i];if(ev.has(x.p.ev)||pl.has(x.p.name))continue;
      ev.add(x.p.ev);pl.add(x.p.name);cur.push(x);go(i+1,cur,ev,pl,pr*x.chance,pay*payOf(x));cur.pop();ev.delete(x.p.ev);pl.delete(x.p.name)}};

  const r=best||fallback;if(!r)return null;
  return {legs:r.legs,pr:r.pr,pay:r.pay,hit:!!best};
}

  h+=`<div class="sec">Ask the Brain · AI</div><div class="panel"><input id="aiq" class="fld" style="margin-top:0" value="${esc(AI.q)}" placeholder="Ask anything, or leave blank for a full read"><button data-ai="1" class="btn" style="margin-top:10px;width:100%" ${AI.busy?'disabled':''}>${AI.busy?'Thinking…':'🧠 Get AI read'}</button><div style="height:1px;background:rgba(100,116,139,.2);margin:16px 0"></div>${sliderHTML()}<div class="note" style="margin-top:8px">Set a target multiplier and the Brain hunts the open props for the best parlay near it.</div></div>${aiResultHTML()}`+logHTML();
  h+=`<div class="note" style="margin-top:12px">${DBOK?'Skills are saved to your account.':'Skills are saved on this device.'} The Brain learns from your own settled bets and the open markets. It can't see other traders' positions.</div>`;
  return h;
}
function sheetHTML(){
  if(!SHEET||!AN)return '';
  const nodes=nodeList(),b=nodes.find(x=>x.id===SHEET);if(!b)return '';
  const row=DBS[b.id]||LOCALDB[b.id];
  const par=b.parent?nodes.find(x=>x.id===b.parent):null;
  let h=`<div class="sheetbg" data-close="1"><div class="sheet"><div class="row"><div class="gt">${esc(b.name)}</div><button class="chip" data-close="1">Close</button></div>`;
  if(par)h+=`<div class="wp" style="text-align:left">Sub-skill of <a data-skill="${par.id}" style="color:var(--cy);font-weight:600">${esc(par.name)}</a></div>`;
  if(b.desc)h+=`<div class="wp" style="text-align:left">${esc(b.desc)}</div>`;
  if(!b.learned){h+=`<div class="wp" style="margin-top:12px;text-align:left">Not learned yet. Needs <b>${b.need}</b> ${b.unit}${b.need>1?'s':''}; you have <b>${b.n}</b>.</div>`}
  else{
    h+=`<div class="wp" style="margin:10px 0 0;text-align:left">Level ${b.level} of 3${b.next?' · next at '+b.next+' '+b.unit+'s ('+b.n+' now)':' · maxed'}</div><div class="bar"><i style="width:${b.next?Math.min(100,b.n/b.next*100):100}%"></i></div>`;
    if(b.met&&b.met.n>0){const m=b.met;const rk=nodes.filter(x=>x.met&&x.learned&&x.met.n>=3).sort((p,q)=>q.met.score-p.met.score);const pos=rk.findIndex(x=>x.id===b.id);
      h+=`<div class="sec" style="margin-top:12px">Contribution to winning</div><div class="stats cols2" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b style="color:${m.lift>=0?'var(--lm)':'var(--rd)'}">${sgn(m.lift)}</b><span>vs your avg</span></div><div class="stat"><b>${m.h}/${m.n}</b><span>Legs hit</span></div><div class="stat"><b>${Math.round(m.share*100)}%</b><span>Of your wins</span></div></div>
      <div class="lg">${m.tix} ticket${m.tix===1?'':'s'} used this · ${m.wonT} won<b>${m.pl>=0?'+':'−'}${fmt$(Math.abs(m.pl))}</b></div><div class="wp" style="text-align:left">Ticket profit is shared with the other legs on those tickets.</div>${pos>=0?`<div class="wp" style="text-align:left"><b>#${pos+1}</b> of ${rk.length} skills by impact${pos===0&&m.score>0?' · ★ MVP':''}</div>`:''}`}
    h+=`<div class="sec" style="margin-top:12px">What it learned</div>${b.ins.lines.map(l=>`<div class="lg">${esc(l)}</div>`).join('')}`;
    if(b.ins.effect)h+=`<div class="sec" style="margin-top:12px">How it helps you</div><div class="wp" style="text-align:left">${esc(b.ins.effect)}</div>`;
    if(row&&row.learned_at)h+=`<div class="sec" style="margin-top:12px">Timeline</div>`+(row.events||[{level:1,at:row.learned_at}]).map(e=>`<div class="lg">Level ${e.level} · ${new Date(e.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})}</div>`).join('');
  }
  if(!b.parent){const kids=nodes.filter(x=>x.parent===b.id);if(kids.length)h+=`<div class="sec" style="margin-top:12px">Sub-skills</div>`+kids.map(k=>`<div class="sub" data-skill="${k.id}"><b>${esc(k.name)}</b><span class="mut" style="font-size:12px">${k.learned?'LV '+k.level:'🔒 '+k.n+'/'+k.need}</span><span class="v" style="color:${k.met&&k.met.n>=3?(k.met.lift>=.05?'var(--lm)':k.met.lift<=-.05?'var(--rd)':'var(--mut)'):'var(--mut)'}">${k.met&&k.met.n>=3?sgn(k.met.lift):''}</span></div>`).join('')}
  return h+`</div></div>`;
}
function navHTML(){
  const T=[['live','◉','Live'],['history','☰','History'],['stats','▦','Stats'],['picks','★','Picks'],['parlays','⚡','Parlays'],['brain','✦','Brain']];
  return `<nav class="nav">${T.map(t=>`<button data-tab="${t[0]}" class="${TAB===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`+(TOASTS.length?`<div class="toasts">${TOASTS.map(t=>`<div class="toast">${esc(t)}</div>`).join('')}</div>`:'');
}

// ================= EVENTS =================
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.aiopen){AIOPEN=true;render();return}
  if(b.dataset.scan){doScan();return}
  if(b.dataset.treereset){TREE.yaw=.6;TREE.pitch=-.25;TREE.zoom=1;TREE.vy=TREE.vp=0;return}
  if(b.dataset.zoom){TREE.zoom=Math.max(.7,Math.min(2.2,TREE.zoom*(b.dataset.zoom==='1'?1.2:.83)));return}
  if(b.id==='su'){doLogin('up');return}
  if(b.id==='out'){AUTH=null;saveAuth();TICKETS=[];LEGS=[];GAMES=[];BETS=[];S=null;HIST={loaded:false,ok:false,err:'',at:0};MKT={loaded:false,ok:false,err:'',at:0,list:[]};DBS={};DBLOADED=false;TAB='live';PS={ok:false,err:'',at:0,loaded:false};F={games:{},stats:{},ok:false,err:'',at:0};LAST='';render();return}
  if(b.dataset.f){filter=b.dataset.f;render();return}
  if(b.dataset.pf){PFILTER=b.dataset.pf;render();return}
  if(b.dataset.tab){TAB=b.dataset.tab;SHEET=null;LAST='';render();window.scrollTo(0,0);return}
});
document.addEventListener('click',e=>{
  if(SHEET&&(e.target.classList.contains('sheetbg')||e.target.closest('button[data-close]'))){SHEET=null;render();return}
  const sk=e.target.closest('[data-skill]');if(sk){SHEET=sk.dataset.skill;SEEN[SHEET]=1;try{localStorage.setItem('pt-seen',JSON.stringify(SEEN))}catch(x){}render();return}
  const hb=e.target.closest('[data-bet]');if(hb){const i=+hb.dataset.bet;OPENBET=OPENBET===i?null:i;render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='lf'){e.preventDefault();doLogin('in')}});
render();
setInterval(tick,1000);
if(AUTH){pollPos();pollHist();pollMkts()}
setInterval(pollPos,5000);setInterval(pollHist,60000);setInterval(pollMkts,30000);
setInterval(pollEspn,1000);
document.addEventListener('click',e=>{const l=e.target.closest&&e.target.closest('[data-log]');if(!l)return;const i=+l.dataset.log;OPENLOG=OPENLOG===i?-1:i;render()});
document.addEventListener('change',e=>{if(e.target.id==='tgtr')render()});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-slip],[data-tgt]');if(!t)return;
  if(t.dataset.slip){PICKING=true;render();return}
  const v=t.dataset.tgt;if(v==='cancel'){PICKING=false;render();return}
  let n=v==='custom'?parseFloat((document.getElementById('tgtc')||{}).value):+v;if(!(n>=1.5))return;n=Math.min(500,n);TARGET=n;PICKING=false;try{localStorage.setItem('pt-target',String(n))}catch(x){}render()});
document.addEventListener('input',e=>{if(e.target.id==='tgtr'){let v=1.5*Math.pow(100/1.5,e.target.value/100);v=v<10?Math.round(v*2)/2:Math.round(v);TARGET=v;const l=document.getElementById('tgtv');if(l)l.textContent=v+'x';try{localStorage.setItem('pt-target',String(v))}catch(x){}return}
if(e.target.id==='aiq')AI.q=e.target.value});
document.addEventListener('click',e=>{var b=e.target.closest&&e.target.closest('[data-ai]');if(b){if(b.dataset.ai==='parlay')askBrain('Build me ONE parlay aiming for about '+(TARGET||3)+'x payout, using the slip in the data as a starting point (you may swap legs). One leg per game. For each leg say why it fits my habits and risk, give the combined hit chance, and tell me honestly if that target is realistic or if I should skip.','parlay');else askBrain(AI.q,AI.q?'ask':'read')}});
</script>
